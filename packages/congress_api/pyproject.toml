[project]
name = "congress-api"
version = "0.1.0"
description = "API Client for Congress.gov API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "committee-meeting",
    "congress-shared",
    "youtube-api",
    "lxml",
    "requests",
    "pypdf[fonts]>=6,<7",
    "tinydb",
  "google-genai",
  "yt-dlp",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
house-meeting-records = "congress_api.house.records:parse_args_and_run"
senate-meeting-records = "congress_api.senate.records:parse_args_and_run"
meeting-inventory = "congress_api.inventory.main:parse_args_and_run"
congress-fetch = "congress_api.fetch.main:parse_args_and_run"
congress-analyze = "congress_api.analyze.main:parse_args_and_run"
gpo-fetch = "congress_api.gpo.fetch:parse_args_and_run"
gpo-match = "congress_api.gpo.match:parse_args_and_run"
senate-captions = "congress_api.senate.captions:parse_args_and_run"
hearing-transcribe = "congress_api.transcribe.main:parse_args_and_run"
gpo-transcripts = "congress_api.gpo.transcripts:parse_args_and_run"
congress-meetings = "congress_api.meetings:parse_args_and_run"
congress-committees = "congress_api.committee_metadata:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# uv-native path sources (ignored by pip). Lets `uv pip install -e .`
# resolve the sibling packages from the local tree instead of an index.
[tool.uv.sources]
committee-meeting = { path = "../committee_meeting", editable = true }
congress-shared = { path = "../congress_shared", editable = true }
youtube-api = { path = "../youtube_api", editable = true }
