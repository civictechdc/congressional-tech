[project]
name = "congress-api"
version = "0.1.0"
description = "API Client for Congress.gov API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "committee-meeting",
    "congress-shared",
    "lxml",
    "requests",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pypdf[fonts]>=6,<7",
  "google-genai",
  "yt-dlp",
]

[project.optional-dependencies]
archive = ["pyarrow>=19,<24", "boto3>=1.40,<2", "aiobotocore>=3.9,<4", "house-naming-guide"]
test = ["pytest>=9,<10"]

[project.scripts]
raw-source-sync = "congress_api.cli.raw_sync:main"
house-meeting-records = "congress_api.cli.house:parse_args_and_run"
senate-meeting-records = "congress_api.cli.senate:parse_args_and_run"
meeting-inventory = "congress_api.cli.inventory:parse_args_and_run"
gpo-fetch = "congress_api.cli.gpo_fetch:parse_args_and_run"
gpo-match = "congress_api.cli.gpo_match:parse_args_and_run"
senate-captions = "congress_api.cli.senate_captions:parse_args_and_run"
hearing-transcribe = "congress_api.cli.transcribe:parse_args_and_run"
gpo-transcripts = "congress_api.cli.gpo_transcripts:parse_args_and_run"
congress-meetings = "congress_api.cli.meetings:parse_args_and_run"
congress-committees = "congress_api.cli.committees:parse_args_and_run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# uv-native path sources (ignored by pip). Lets `uv pip install -e .`
# resolve the sibling packages from the local tree instead of an index.
[tool.uv.sources]
committee-meeting = { path = "../committee_meeting", editable = true }
congress-shared = { path = "../congress_shared", editable = true }
house-naming-guide = { path = "../house-naming", editable = true }

# Direct imports between responsibility folders. Same-folder imports are allowed.
# tests/test_congress_api_imports.py checks absolute, relative and function-local imports.
[tool.congress-api.import-fences]
models = []
parsers = ["models"]
matching = ["models", "parsers"]
retention = ["models", "parsers", "matching"]
transport = ["models", "parsers", "retention"]
acquisition = ["models", "parsers", "matching", "retention", "transport"]
transcripts = ["models", "parsers", "matching", "retention", "transport"]
replay = ["parsers", "matching", "retention", "acquisition"]
adapters = ["models", "parsers", "matching"]
cli = ["models", "parsers", "matching", "retention", "transport", "acquisition", "transcripts", "replay", "adapters"]
