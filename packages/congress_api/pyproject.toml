[project]
name = "congress-api"
version = "0.1.0"
description = "API Client for Congress.gov API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "committee-meeting",
    "congress-shared",
    "docspec-client",
    "lxml",
    "requests",
    "pydantic>=2.11,<3",
    "pypdf[fonts]>=6.21.4,<7",
    "Pillow>=13,<14",
  "google-genai",
  "yt-dlp",
]

[project.optional-dependencies]
# Checkpoint digests include Parquet writer metadata; readers/writers must match.
archive = [
    "pyarrow==25.0.1",
    "duckdb>=1.5.5,<2",
    "boto3>=1.40,<2",
    "aiobotocore>=3.9,<4",
    "house-naming-guide",
    "surt>=0.3.1,<0.4",
    "ijson>=3.4,<4",
    "trafilatura==2.0.0",
    "pytz==2026.5",
    "extruct==0.18.0",
    # body_text (data model §6.6): spicy-docs' body-text derivation and WARC reader. Its
    # pdf and acquisition extras are not requested: pdf pins Pillow<13 against ours, so
    # PyMuPDF and warcio are named directly at the versions those extras allow.
    "spicy-docs==0.78.0; python_version < '3.13'",
    # spicy-docs' own dependency, vendored beside it; named so its path source binds.
    "rulespec-artifacts==1.1.2; python_version < '3.13'",
    "pymupdf>=1.28,<2",
    "warcio==1.7.5",
]
test = ["pytest>=9,<10"]

[project.scripts]
house-committee-sites = "congress_api.cli.house_sites:parse_args_and_run"
house-meeting-records = "congress_api.cli.house:parse_args_and_run"
senate-meeting-records = "congress_api.cli.senate:parse_args_and_run"
meeting-inventory = "congress_api.cli.inventory:parse_args_and_run"
gpo-fetch = "congress_api.cli.gpo_fetch:parse_args_and_run"
gpo-match = "congress_api.cli.gpo_match:parse_args_and_run"
senate-captions = "congress_api.cli.senate_captions:parse_args_and_run"
hearing-transcribe = "congress_api.cli.transcribe:parse_args_and_run"
gpo-transcripts = "congress_api.cli.gpo_transcripts:parse_args_and_run"
congress-meetings = "congress_api.cli.meetings:parse_args_and_run"
congress-committees = "congress_api.cli.committees:parse_args_and_run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


# Direct imports between responsibility folders. Same-folder imports are allowed.
# packages/congress_api/tests/test_congress_api_imports.py checks absolute, relative and function-local imports.
[tool.congress-api.import-fences]
models = []
parsers = ["models"]
matching = ["models", "parsers"]
retention = ["models", "parsers", "matching", "lake"]
lake = ["models", "parsers", "retention"]
transport = ["models", "parsers", "retention"]
acquisition = ["models", "parsers", "matching", "retention", "transport"]
transcripts = ["models", "parsers", "matching", "retention", "transport"]
adapters = ["models", "parsers", "matching"]
cli = ["models", "parsers", "matching", "retention", "transport", "acquisition", "transcripts", "adapters", "lake"]
