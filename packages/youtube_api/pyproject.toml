[project]
name = "youtube-api"
version = "0.1.0"
description = "YouTube API Client for Congressional Tech"
requires-python = ">=3.12"
dependencies = [
    "committee-meeting",
    "congress-shared",
    "google-api-python-client",
    "tinydb",
    "yt-dlp",
    "curl_cffi",  # lets yt-dlp impersonate a browser, which YouTube's bot check usually accepts
    "pydantic>=2.0",
]

[project.scripts]
youtube-fetch = "youtube_api.fetch.main:parse_args_and_run"
youtube-analyze = "youtube_api.analyze.main:parse_args_and_run"
youtube-captions = "youtube_api.captions.main:parse_args_and_run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
