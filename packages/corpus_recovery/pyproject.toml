[project]
name = "corpus-recovery"
version = "0.1.0"
description = "Library for sealed corpus recovery import, mapping publication, and body reconciliation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "congress-api[archive]",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
