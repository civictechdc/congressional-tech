[project]
name = "viewer-publication"
version = "0.1.0"
description = "Archive release publication, conditional pointer flips, and read-only verification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "congress-api[archive]",
    "congress-shared",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
