[project]
name = "news-lake"
version = "0.1.0"
description = "Political news lake: record contract and the Iceberg storage boundary."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "congress-shared",
    "docspec-client",
    "jsonschema>=4.18,<5",
    "rfc3987>=1.3",
    "rfc3339-validator>=0.1",
    "pyarrow>=15",
    "pyiceberg[pyarrow,sql-sqlite]>=0.12,<0.13",
    "feedparser>=6,<7",
    "tldextract>=5",
]

[project.scripts]
news-lake = "news_lake.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"news_lake.contract" = ["schema/*.json"]
