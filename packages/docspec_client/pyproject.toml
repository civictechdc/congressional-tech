[project]
name = "docspec-client"
version = "0.1.0"
description = "Neutral transport and custody for the maintained DocSpec engine."
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0",
    "httpx>=0.28,<1",
    "pyarrow>=15",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
