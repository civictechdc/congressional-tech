[pytest]
# Own rootdir on purpose: the docmeta-model lane runs these files under the fast-gemma4 interpreter
# (scripts/model_lane.py), which the repository's root conftest.py would refuse. Under the repository's own
# interpreter (production-offline) the same files are collected and skip, since the engine is not installed there.
testpaths = .
pythonpath = ..
addopts = -ra -p no:cacheprovider
