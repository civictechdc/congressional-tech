[project]
name = "congress-docmeta"
version = "0.1.0"
description = "DocMeta: rules, parsers, schema, prompts and the model sweep driver for congressional documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=15",
    "jsonschema>=4.18,<5",
    # address_reader/ is a copy of Keeplist's reader; these pins are the revision it was measured on.
    # Required, not optional: without them rule R8 would write no work addresses and raise nothing.
    "usaddress==0.5.14",
    "pycountry==26.2.16",
    "msgspec-schemaorg==0.2.1",
    "msgspec==0.21.1",
]
# fast-gemma4 (the Apple Silicon engine) is deliberately not listed: it has no remote and no Linux build,
# so it cannot enter uv.lock. Modules that generate import it on first use; see README.md.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
congress_docmeta = ["*.json"]
