[project]
name = "congress-docmeta"
version = "0.1.0"
description = "DocMeta: rules, parsers, schema, prompts and the model sweep driver for congressional documents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=15",
    "jsonschema>=4.18,<5",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "duckdb>=1",
    "numpy>=1.26",
    "viewer-publication",
]
# MLX / Apple Silicon student dependencies remain external to uv.lock (separate training runtime).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
congress_docmeta = [
    "v7/*.yaml",
]
