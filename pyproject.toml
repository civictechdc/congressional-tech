[project]
name = "congressional-tech-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "house-naming-guide[test]",
    "committee-meeting",
    "congress-shared",
    "docspec-client",
    "youtube-api",
    "congress-api[archive,test]",
    "congress-youtube",
    "viewer-publication",
    "corpus-recovery",
    "news-lake",
    "inflation-gsheets",
]

[dependency-groups]
dev = [
    "PyYAML>=6,<7",
    "readability-lxml>=0.9",
]

[tool.uv]
package = false
constraint-dependencies = [
    "certifi>=2026.10.23",
    "httplib2>=0.32.0",
    "urllib3>=2.8.0",
    # One PyObjC release across the core and the frameworks AppleVision's bindings pull in:
    # the release spicy-docs measured Vision on (congress-api's archive extra names Vision and Quartz).
    "pyobjc-core==12.2.2",
]


[tool.uv.workspace]
members = [
    "packages/house-naming",
    "packages/committee_meeting",
    "packages/congress_shared",
    "packages/youtube_api",
    "packages/congress_api",
    "packages/docspec_client",
    "packages/viewer_publication",
    "packages/corpus_recovery",
    "packages/news_lake",
    "apps/committee_youtube",
    "apps/inflation_gsheets",
]

[tool.uv.sources]
house-naming-guide = { workspace = true }
committee-meeting = { workspace = true }
congress-shared = { workspace = true }
youtube-api = { workspace = true }
congress-api = { workspace = true }
docspec-client = { workspace = true }
congress-youtube = { workspace = true }
viewer-publication = { workspace = true }
corpus-recovery = { workspace = true }
news-lake = { workspace = true }
inflation-gsheets = { workspace = true }
# Sibling readers ship as vendored wheels, as spicy-regs binds them; the build
# receipt beside each wheel names its source commit (vendor/spicy_docs-*.json).
spicy-docs = { path = "vendor/spicy_docs-0.85.0-py3-none-any.whl" }
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.1.2-py3-none-any.whl" }
