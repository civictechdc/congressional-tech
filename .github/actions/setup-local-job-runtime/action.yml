name: Install the approved local job runtime
description: Install the private pinned binary with credential-free local job configuration.
inputs:
  artifact:
    required: true
    description: Approved DOCSPEC_RUNTIME_ARTIFACT JSON descriptor.
  credentials:
    required: true
    description: Private runtime download credentials; used only during this step.
  account-id:
    required: true
    description: Cloudflare account hosting the private runtime bucket.
runs:
  using: composite
  steps:
    - name: Verify private runtime bytes and offline prerequisites
      shell: bash
      env:
        DOCSPEC_RUNTIME_ARTIFACT: ${{ inputs.artifact }}
        DOCSPEC_ENGINE_CREDENTIALS: ${{ inputs.credentials }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: >-
        .venv/bin/python -I .github/scripts/setup-native-runtime.py --local
        --directory "$RUNNER_TEMP/docspec-local-runtime"
        --output "$RUNNER_TEMP/docspec-local-runtime-check.json" --github-env "$GITHUB_ENV"
