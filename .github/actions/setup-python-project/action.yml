name: Set up the Python workspace
description: Install native PDF tools and the locked eight-member Python environment.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.11.21"
        enable-cache: true
    # Poppler is pinned in test-suites.toml ([environment.poppler]): the sniff
    # parser_version hashes its -v lines, and apt ships another release.
    - name: Read the Poppler pin
      id: poppler
      shell: bash
      run: |
        version=$(python -c 'import tomllib; print(tomllib.load(open("test-suites.toml", "rb"))["environment"]["poppler"]["version"])')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "prefix=$HOME/.local/poppler-$version" >> "$GITHUB_OUTPUT"
    - name: Restore the pinned Poppler build
      id: poppler-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.poppler.outputs.prefix }}
        key: poppler-${{ steps.poppler.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/scripts/install-poppler.sh', '.github/actions/setup-python-project/action.yml') }}
    - name: Install PDF and process tools
      shell: bash
      env:
        POPPLER_PREFIX: ${{ steps.poppler.outputs.prefix }}
        POPPLER_CACHED: ${{ steps.poppler-cache.outputs.cache-hit }}
      run: |
        sudo apt-get update
        libraries="libfreetype6 libfontconfig1 libjpeg-turbo8 libpng16-16t64 libtiff6 libopenjp2-7 liblcms2-2"
        if [ "$POPPLER_CACHED" != true ]; then
          libraries="ninja-build pkg-config libfreetype-dev libfontconfig-dev libjpeg-dev libpng-dev libtiff-dev libopenjp2-7-dev liblcms2-dev zlib1g-dev"
        fi
        sudo apt-get install -y --no-install-recommends procps poppler-data $libraries
        if [ "$POPPLER_CACHED" != true ]; then
          .github/scripts/install-poppler.sh "$POPPLER_PREFIX"
        fi
        echo "$POPPLER_PREFIX/bin" >> "$GITHUB_PATH"
    - name: Sync the locked workspace
      shell: bash
      run: |
        uv sync --locked
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
    - name: Prepare historical baseline and check prerequisites
      shell: bash
      run: |
        python scripts/dev.py prepare-baseline
        python scripts/dev.py inventory
        python scripts/dev.py doctor
