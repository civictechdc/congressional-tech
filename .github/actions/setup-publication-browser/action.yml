name: Set up the publication verification browser
description: Install headless Chromium for the Playwright that apps/site/package.json pins.
runs:
  using: composite
  steps:
    # One pin: the site lock installs playwright (setup-node-project runs first),
    # and the scripts load that copy, so CI and local runs cannot diverge.
    - name: Install Chromium for the site's pinned Playwright
      shell: bash
      run: |
        set -euo pipefail
        cli=apps/site/node_modules/playwright/cli.js
        if [[ ! -f "$cli" ]]; then
          echo 'Run setup-node-project first: apps/site/package.json pins playwright' >&2
          exit 1
        fi
        node "$cli" install --with-deps --only-shell chromium
