name: Capture archive sources

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read  # to find the newest validated commit

concurrency:
  group: raw-source-mirror
  cancel-in-progress: false
  queue: max

jobs:
  capture:
    # Owner enables only after disabling old capture and completing final publish.
    if: github.ref == 'refs/heads/main' && vars.ARCHIVE_CAPTURE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # Holds raw-source-mirror; budgeted runs took up to 23 minutes (Nov 2026).
    timeout-minutes: 120
    environment: archive-capture
    steps:
      # Production runs the newest commit of main that passed validation, never an untested tip
      # (run 44087092120's first attempt ran a commit whose validation had failed). A capture and
      # the publish after it both take this commit, so a producing commit is an ancestor of the
      # publisher's, as gate 5 requires.
      - name: Select the newest validated commit of main
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/validate-explorer.yml/runs?branch=main&event=push&status=success&per_page=1" \
            | jq -er '.workflow_runs[0].head_sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated commit: $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.validated.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - uses: ./.github/actions/setup-local-job-runtime
        id: runtime
        with:
          artifact: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          credentials: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          account-id: "174055408ff1560e60601c4d12c561c4"
      # New hearings first (ct-q4e2): the release's URL state has no meeting seeds, and the
      # budgeted capture below may use the job's time. Receipts land under congress/meetings,
      # a family publish-daily reads.
      - name: Relist committee meetings updated in the last week
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_CAPTURE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_CAPTURE_R2_SECRET_ACCESS_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archive-meetings"
          .venv/bin/python -I -m congress_api.cli.fetch_meetings --since-days 7 \
            --user-agent congressional-tech-research/1.0 --apply > "$RUNNER_TEMP/archive-meetings/summary.json"
      - name: Capture from the public release
        # Runs even when the meeting relist failed; the job still reports that failure.
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_CAPTURE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_CAPTURE_R2_SECRET_ACCESS_KEY }}
          ZYTE_TOKEN: ${{ secrets.ZYTE_TOKEN }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          ARCHIVE_POINTER: ${{ vars.ARCHIVE_POINTER_URL }}
          REQUEST_BUDGET: ${{ vars.ARCHIVE_CAPTURE_REQUEST_BUDGET }}
          BYTE_BUDGET: ${{ vars.ARCHIVE_CAPTURE_BYTE_BUDGET }}
          SPOOL_BUDGET: ${{ vars.ARCHIVE_CAPTURE_SPOOL_BUDGET }}
          REVIEWED_CUTOFF_URLS: ${{ vars.ARCHIVE_CAPTURE_CUTOFF_URLS }}
        run: |
          set -euo pipefail
          for value in "$REQUEST_BUDGET" "$BYTE_BUDGET" "$SPOOL_BUDGET"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]] || { echo 'Capture budgets must be positive integers' >&2; exit 2; }
          done
          set --
          if [[ -n "$REVIEWED_CUTOFF_URLS" ]]; then
            cutoff_file="$RUNNER_TEMP/archive-capture-cutoff-urls.json"
            printf '%s\n' "$REVIEWED_CUTOFF_URLS" > "$cutoff_file"
            set -- --cutoff-urls "$cutoff_file"
          fi
          .venv/bin/python -I -m congress_api.cli.capture_schedule \
            --pointer "$ARCHIVE_POINTER" --request-budget "$REQUEST_BUDGET" \
            --byte-budget "$BYTE_BUDGET" --spool-budget "$SPOOL_BUDGET" \
            --work "$RUNNER_TEMP/archive-capture" "$@" --apply
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archive-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/archive-capture/selection.json
            ${{ runner.temp }}/archive-capture/summary.json
            ${{ runner.temp }}/archive-capture/capture/summary.json
            ${{ runner.temp }}/archive-meetings/summary.json
          if-no-files-found: ignore
