name: Download and Convert CPI XLSX

on:
  schedule:
    - cron: "0 6 3 * *" # 6am UTC on the 3rd of each month
  workflow_dispatch:

jobs:
  update-cpi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pandas openpyxl requests

      - name: Download XLSX from BLS and convert to CSV
        run: python apps/inflation_gsheets/src/fetch-cpi-convert-csv.py

      # Runs AFTER the BLS step so the multi-source table reads the freshly
      # refreshed historical-cpi.csv (BLS YoY is derived from it). Tolerates
      # unavailable sources: BLS and FRED (keyless) must succeed; Adobe /
      # PriceStats skip gracefully unless a manual drop-file is present.
      # --aggregate emits the derived, opt-in composite column (see README).
      - name: Build multi-source inflation table
        run: python apps/inflation_gsheets/src/fetch-inflation-sources.py --aggregate

      - name: Commit and push CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/inflation_gsheets/src/data/historical-cpi.csv
          git add apps/inflation_gsheets/src/data/inflation-sources.csv
          git commit -m "Auto-updated CPI + multi-source inflation CSVs" || echo "No changes"
          git push
