name: Download and Convert CPI XLSX

on:
  schedule:
    - cron: "0 6 3 * *" # 6am UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: write
  statuses: write  # commit-and-push.sh marks its data commit for main's merge-gate rule

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  update-cpi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
      - name: Install the locked inflation-gsheets packages
        run: |
          uv sync --locked --no-dev --package inflation-gsheets
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # The workflow name stays (ci-alerts.yml watches it), but no step reads a
      # spreadsheet: the BLS JSON API fills a CSV, so the job needs no openpyxl.
      - name: Fetch CPI from the BLS API and append it to the CSV
        run: python apps/inflation_gsheets/src/fetch-cpi-convert-csv.py

      # Runs AFTER the BLS step so the multi-source table reads the freshly
      # refreshed historical-cpi.csv (BLS YoY is derived from it). Tolerates
      # unavailable sources: BLS and FRED (keyless) must succeed; Adobe /
      # PriceStats skip gracefully unless a manual drop-file is present.
      # --aggregate emits the derived, opt-in composite column (see README).
      - name: Build multi-source inflation table
        run: python apps/inflation_gsheets/src/fetch-inflation-sources.py --aggregate

      # Another scheduled workflow may push to main first: the script rebases and
      # retries, and fails the step when the last push is still rejected.
      - name: Commit and push CSVs
        run: |
          .github/scripts/commit-and-push.sh "Auto-updated CPI + multi-source inflation CSVs" \
            apps/inflation_gsheets/src/data/historical-cpi.csv \
            apps/inflation_gsheets/src/data/inflation-sources.csv
