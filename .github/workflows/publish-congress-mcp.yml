name: Publish Congress MCP

on:
  push:
    tags: ['congress-mcp-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing congress-mcp-vVERSION tag to publish
        required: true
        type: string
      publish_pypi:
        description: Publish to PyPI after configuring its trusted publisher
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: congress-mcp-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
      - id: release
        name: Validate the release version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          registry = json.loads(Path('apps/explorer_mcp/server.json').read_text())
          if not re.fullmatch(r'congress-mcp-v[0-9]+\.[0-9]+\.[0-9]+', tag) or tag != 'congress-mcp-v' + registry['version']:
              raise SystemExit('Tag must match server.json version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('tag=' + tag + '\n')
          PY
      - run: uv sync --locked --project apps/explorer_mcp
      - run: apps/explorer_mcp/.venv/bin/python scripts/dev.py test explorer-mcp -- -q
      - run: uv build apps/explorer_mcp --out-dir dist
      - run: uvx --from twine twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: congress-mcp-distributions
          path: dist/*

  install:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
      - uses: actions/download-artifact@v4
        with:
          name: congress-mcp-distributions
          path: dist
      - name: Install and query from outside the repository
        run: uv run --no-project --python 3.12 apps/explorer_mcp/scripts/check_distribution.py dist/*.whl

  github-release:
    needs: [build, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: congress-mcp-distributions
          path: dist
      - name: Publish versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite published assets.'
            exit 0
          fi
          sha256sum dist/* > dist/SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Run Congress Explorer locally from your AI assistant. This release includes client configuration output and an MCP installation check.

          Setup: https://civictechdc.github.io/congressional-tech/mcp/

          macOS and Linux; Python 3.12 managed by uv. Downloaded data is refreshed separately with `congress-explorer-mcp prepare`. Windows is not yet supported.
          NOTES
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Congress Explorer MCP ${RELEASE_TAG#congress-mcp-v}" --notes-file release-notes.md --latest=false

  pypi:
    if: inputs.publish_pypi == true
    needs: [build, install, github-release]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Reuse the exact published GitHub distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
