name: Validate Committee Explorer

on:
  pull_request:
    paths:
      - "apps/committee_youtube/**"
      - "apps/site/**"
      - "infra/cloudflare/**"
      - "packages/committee_meeting/**"
      - "packages/congress_api/**"
      - "packages/house-naming/**"
      - "packages/congress_shared/**"
      - "packages/docspec_client/**"
      - "packages/youtube_api/**"
      - "packages/corpus_recovery/**"
      - "packages/news_lake/**"
      - "packages/news-lake/**"
      - "packages/viewer_publication/**"
      - "packages/source-fetch/**"
      - "tests/**"
      - "scripts/corpus_recovery/**"
      - "scripts/publication/**"
      - "scripts/measure/**"
      - "scripts/webharvest/**"
      - "scripts/tests/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/**"
      - "package.json"
      - "pyproject.toml"
      - ".node-version"
      - ".python-version"
      - "uv.lock"
      - "pytest.ini"
      - "test-suites.toml"
      - "scripts/dev.py"
      - "docs/experiments/**"
      - ".github/actions/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-explorer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - name: Install the approved DocSpec runtime for native fixture checks
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_ACCOUNT_ID: "174055408ff1560e60601c4d12c561c4"
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
        run: |
          if [[ -z "${DOCSPEC_RUNTIME_ARTIFACT:-}" || -z "${DOCSPEC_ENGINE_CREDENTIALS:-}" ]]; then
            echo "Approved DocSpec fixture runtime unavailable: use a trusted validation run with the configured private artifact."
            exit 1
          fi
          python .github/scripts/setup-native-runtime.py \
            --directory "$RUNNER_TEMP/docspec-validation" \
            --output "$RUNNER_TEMP/docspec-validation.json"
          echo "DOCSPEC_BINARY=$RUNNER_TEMP/docspec-validation/docspec" >> "$GITHUB_ENV"
      - name: Test models, retained-source adapters and publication offline
        run: python scripts/dev.py test production-offline
      - name: Test active experiment fixtures and historical PDF worker
        run: python scripts/dev.py test active-experiment-regression
      - name: Build the native loopback transport
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --locked --release --manifest-path packages/source-fetch/Cargo.toml --bin source-fetch
      - name: Test real sockets and spawned workers on loopback
        env:
          SOURCE_FETCH_BINARY: ${{ github.workspace }}/packages/source-fetch/target/release/source-fetch
        run: python scripts/dev.py test native-loopback
      - uses: ./.github/actions/setup-node-project
      - name: Test browser data loading and model type generation
        working-directory: apps/site
        run: |
          npm run test:explorer
          npm run check:explorer-types
      - name: Check Astro and TypeScript
        working-directory: apps/site
        run: npx --no-install astro check
      - name: Build the static site
        working-directory: apps/site
        run: npm run build
