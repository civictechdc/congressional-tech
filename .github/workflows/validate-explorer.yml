name: Validate Committee Explorer

on:
  pull_request:
    paths:
      - "apps/committee_youtube/**"
      - "apps/site/**"
      - "apps/explorer_mcp/server.json"
      - "infra/cloudflare/**"
      - "packages/committee_meeting/**"
      - "packages/congress_api/**"
      - "packages/house-naming/**"
      - "packages/congress_shared/**"
      - "packages/docspec_client/**"
      - "packages/youtube_api/**"
      - "packages/corpus_recovery/**"
      - "packages/news_lake/**"
      - "packages/news-lake/**"
      - "packages/viewer_publication/**"
      - "packages/source-fetch/**"
      - "tests/**"
      - "scripts/corpus_recovery/**"
      - "scripts/publication/**"
      - "scripts/measure/**"
      - "scripts/webharvest/**"
      - "scripts/tests/**"
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/**"
      - "package.json"
      - "pyproject.toml"
      - ".node-version"
      - ".python-version"
      - "uv.lock"
      - "pytest.ini"
      - "test-suites.toml"
      - "scripts/dev.py"
      - "docs/experiments/**"
      - ".github/actions/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validate-explorer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline regressions (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - uses: ./.github/actions/setup-local-job-runtime
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          artifact: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          credentials: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          account-id: "174055408ff1560e60601c4d12c561c4"
      - uses: ./.github/actions/setup-node-project
      - name: Test the complete offline partition
        run: |
          set +e
          .venv/bin/python scripts/dev.py test production-offline --shard ${{ matrix.shard }}/6 -- \
            -v --junitxml=${{ runner.temp }}/offline-${{ matrix.shard }}.xml
          test_status=$?
          printf 'CT_OFFLINE_EXIT_STATUS=%s\n' "$test_status"
          exit "$test_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-${{ matrix.shard }}
          path: ${{ runner.temp }}/offline-${{ matrix.shard }}.xml

  validate:
    needs: offline
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require every offline shard to pass
        env:
          OFFLINE_RESULT: ${{ needs.offline.result }}
        run: test "$OFFLINE_RESULT" = success
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - uses: ./.github/actions/setup-local-job-runtime
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          artifact: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          credentials: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          account-id: "174055408ff1560e60601c4d12c561c4"
      - name: Test active experiment fixtures and historical PDF worker
        run: python scripts/dev.py test active-experiment-regression
      - name: Build the native loopback transport
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --locked --release --manifest-path packages/source-fetch/Cargo.toml --bin source-fetch
      - name: Test real sockets and spawned workers on loopback
        env:
          SOURCE_FETCH_BINARY: ${{ github.workspace }}/packages/source-fetch/target/release/source-fetch
        run: python scripts/dev.py test native-loopback
      - uses: ./.github/actions/setup-node-project
      - name: Test browser data loading and model type generation
        working-directory: apps/site
        run: |
          npm run test:explorer
          npm run check:explorer-types
      - name: Check Astro and TypeScript
        working-directory: apps/site
        run: npx --no-install astro check
      - name: Build the static site
        working-directory: apps/site
        run: npm run build
      - uses: ./.github/actions/setup-publication-browser
      - name: Require the archive contract against native hand releases
        env:
          VIEWER_BENCHMARK_MODULES: ${{ env.PUBLICATION_BROWSER_MODULES }}
        run: .venv/bin/python -I .github/scripts/verify-archive-contract.py --work "$RUNNER_TEMP/archive-contract"
