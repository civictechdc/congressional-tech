name: Capture raw sources and rebuild document tables

on:
  push:
    branches: [main]
    # Code pushes validate only. Daily/manual updates publish new evidence.
    # Generated data and pipeline-data commits cannot trigger this path.
    paths:
      - 'packages/house-naming/src/**'
      - 'packages/house-naming/pyproject.toml'
      - 'packages/congress_api/pyproject.toml'
      - 'packages/congress_api/uv.lock'
      - 'packages/congress_api/src/congress_api/cli/raw_sync.py'
      - 'packages/congress_api/src/congress_api/cli/raw_progress.py'
      - 'packages/congress_api/src/congress_api/cli/common.py'
      - 'packages/congress_api/src/congress_api/acquisition/raw_sync.py'
      - 'packages/congress_api/src/congress_api/acquisition/streamed_recovery.py'
      - 'packages/congress_api/src/congress_api/acquisition/recovery_queue.py'
      - 'packages/congress_api/src/congress_api/retention/raw_*.py'
      - 'packages/congress_api/src/congress_api/retention/document_*.py'
      - 'packages/congress_api/src/congress_api/retention/catalog_cache.py'
      - 'packages/congress_api/src/congress_api/retention/capture_metadata.py'
      - 'packages/congress_api/src/congress_api/retention/capture_url_admission.py'
      - 'packages/congress_api/src/congress_api/retention/archive_members.py'
      - 'packages/congress_api/src/congress_api/transport/rust_fetch.py'
      - 'packages/source-fetch/**'
      - 'packages/congress_api/src/congress_api/retention/r2.py'
      - 'packages/congress_api/src/congress_api/parsers/**'
      - 'packages/congress_api/src/congress_api/models/**'
      - 'packages/congress_shared/src/congress_shared/globals.py'
      - 'packages/congress_shared/src/congress_shared/data/**'
      - 'scripts/benchmark_core_rebuild.py'
      - 'tests/test_core_benchmark.py'
      - 'tests/test_core_source_context.py'
      - 'tests/test_catalog_publication.py'
      - 'tests/test_catalog_consumers.py'
      - 'tests/test_catalog_staging.py'
      - 'tests/test_standalone_catalog_publication.py'
      - 'tests/catalog_test_helpers.py'
      - 'packages/congress_api/src/congress_api/retention/catalog_*.py'
      - '.github/scripts/offline-python.py'
      - '.github/scripts/*capture*.py'
      - '.github/tests/test_capture*.py'
      - '.github/scripts/finalize-raw-source.py'
      - '.github/workflows/capture-raw-sources.yml'
      - '.github/tests/test_raw_source_workflow.py'
      - '.github/tests/test_raw_source_finalizer.py'
      - 'tests/test_raw_capture_only.py'
      - 'tests/fixtures/raw_source_floor_schedule.xml'
      - 'tests/fixtures/capture-checkpoint-arrow*.parquet'
      - 'tests/test_capture_checkpoint.py'
      - 'tests/test_capture_metadata.py'
      - 'tests/test_capture_url_admission.py'
      - 'tests/test_capture_delayed_retry.py'
      - 'tests/test_archive_member*.py'
      - 'tests/test_rust_fetch*.py'
      - 'tests/test_capture_processes_native.py'
      - 'tests/test_async_capture*.py'
      - 'tests/test_spooled_capture.py'
      - 'tests/test_r2_archive_store.py'
      - 'tests/test_r2_body_files*.py'
      - 'tests/test_capture_state_completeness.py'
      - 'tests/test_streamed_recovery.py'
      - 'tests/test_recovery_queue.py'
      - 'tests/test_pdf_file_metadata.py'
      - 'tests/test_pdf_metadata_refresh.py'
  schedule:
    # Acquisition is explicitly dispatched after the previous batch verifies.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Update new evidence, capture missing sources, or explicitly reinterpret all metadata
        type: choice
        options: [update, capture, rebuild]
        default: update
        required: true
      repair:
        description: Replay all retained sources and interpretation (normally leave disabled)
        type: boolean
        default: false
      inspect_bodies:
        description: Update or rebuild mode - inspect retained document contents
        type: boolean
        default: false
      limit:
        description: Capture mode only - maximum attempts, including delayed retries (1 to 20000)
        type: number
        default: 20000
      transport:
        description: Capture mode only - source transport (auto tries direct, then Zyte)
        type: choice
        options: [auto, zyte, direct]
        default: auto
      initial_only:
        description: Capture mode - only pending URLs and their in-run retries
        type: boolean
        default: true
      previous_summary:
        description: Optional completed capture summary JSON to verify before new writes
        type: string
        default: ''
      expected_source_digest:
        description: Optional source manifest SHA-256 to require before new writes
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Only data operations hold the shared R2 writer lock.
  group: ${{ github.event_name == 'push' && format('raw-source-validation-{0}', github.ref) || 'raw-source-mirror' }}
  cancel-in-progress: false
  # A capture batch must not replace a queued rebuild (or the reverse).
  queue: max

jobs:
  capture:
    name: ${{ github.event_name == 'push' && 'Validate raw-source code' || 'Run raw-source operation' }}
    runs-on: ubuntu-24.04
    # Allow up to five hours of admission, then drain, checkpoint and verify.
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Select operation
        id: operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT_NAME" in
            push) mode=validate ;;
            workflow_dispatch) mode="$INPUT_MODE" ;;
            schedule)
              case "$EVENT_SCHEDULE" in
                '23 3 * * *') mode=update ;;
                *) echo "Unsupported schedule: $EVENT_SCHEDULE" >&2; exit 1 ;;
              esac
              ;;
            *) echo "Unsupported event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          case "$mode" in
            validate|update|rebuild|capture) echo "mode=$mode" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unsupported operation: $mode" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        with:
          # Validate and execute the same immutable revision, also on reruns.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        if: steps.operation.outputs.mode != 'validate'
        with:
          ref: pipeline-data
          path: pipeline-data
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bounded PDF fallback tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install capture and rebuild tools
        run: >-
          pip install -e 'packages/house-naming[test]' -e packages/committee_meeting
          -e packages/congress_shared -e 'packages/congress_api[archive,test]' 'PyYAML>=6,<7'
      - name: Identify installed validation environment
        id: runtime
        run: |
          python -m pip freeze --exclude-editable > /tmp/raw-source-dependencies.txt
          python --version >> /tmp/raw-source-dependencies.txt
          pdfinfo -v 2>> /tmp/raw-source-dependencies.txt
          pdftotext -v 2>> /tmp/raw-source-dependencies.txt
          echo "key=$(sha256sum /tmp/raw-source-dependencies.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: verified
        with:
          path: .cache/raw-source-verified
          key: raw-verified-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ steps.runtime.outputs.key }}
      - name: Verify capture and recovery offline
        env:
          CORE_BENCHMARK_REPORT: core-benchmark-smoke.json
        if: steps.verified.outputs.cache-hit != 'true'
        run: >-
          python .github/scripts/offline-python.py -m pytest -q
          tests/test_raw_source_sync.py tests/test_raw_capture_only.py tests/test_capture_metadata.py tests/test_source_capture.py tests/test_r2_archive_store.py
          tests/test_async_capture.py tests/test_spooled_capture.py
          tests/test_capture_failure_regressions.py tests/test_pdf_reader_recovery.py tests/test_file_wrapper_capture.py
          tests/test_capture_state_completeness.py tests/test_streamed_recovery.py
          tests/test_recovery_queue.py tests/test_r2_body_files.py tests/test_pdf_file_metadata.py
          tests/test_pdf_metadata_refresh.py
          tests/test_raw_catalog.py tests/test_raw_rebuild.py tests/test_incremental_catalog.py tests/test_capture_checkpoint.py
          tests/test_raw_progress.py tests/test_core_benchmark.py
          tests/test_core_source_context.py tests/test_catalog_publication.py tests/test_catalog_staging.py tests/test_catalog_consumers.py
          tests/test_standalone_catalog_publication.py
          .github/tests/test_raw_source_finalizer.py
          .github/tests/test_capture_verification.py .github/tests/test_capture_memory_guard.py .github/tests/test_capture_source_manifest.py
          tests/test_document_filename_index.py tests/test_document_filename_viewer.py
          tests/test_congress_api_imports.py tests/test_document_link_probe.py
          tests/test_committee_download_wrappers.py
          tests/test_house_sites.py tests/test_house_history_repairs.py tests/test_house_site_concurrency.py tests/test_house_source_failures.py
          tests/test_rust_fetch.py
          tests/test_rust_fetch_retry.py tests/test_capture_delayed_retry.py
          tests/test_archive_members.py tests/test_archive_member_capture.py tests/test_archive_member_catalog.py
          tests/test_capture_url_admission.py
          tests/test_document_evidence.py tests/test_document_retained_recovery.py
          tests/test_published_hearing_cover.py
          tests/test_document_metadata_preservation.py tests/test_document_source_context.py
          tests/test_senate_document_sections.py packages/house-naming/tests
          .github/tests/test_raw_source_workflow.py
      - name: Verify async storage and process workers locally
        if: steps.verified.outputs.cache-hit != 'true'
        run: python -m pytest -q tests/test_async_capture_native.py tests/test_capture_processes_native.py tests/test_r2_body_files_native.py
      - name: Mark successful code validation
        if: steps.verified.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/raw-source-verified
          echo "$GITHUB_SHA" > .cache/raw-source-verified/revision
      - uses: actions/cache/save@v4
        if: steps.verified.outputs.cache-hit != 'true'
        with:
          path: .cache/raw-source-verified
          key: ${{ steps.verified.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v4
        if: steps.operation.outputs.mode == 'capture' || steps.operation.outputs.mode == 'validate'
        id: fetcher
        with:
          path: packages/source-fetch/target/release/source-fetch
          key: raw-fetcher-v1-${{ runner.os }}-${{ runner.arch }}-rust189-${{ github.sha }}-${{ steps.runtime.outputs.key }}
      - name: Build and check the Rust fetcher
        if: (steps.operation.outputs.mode == 'capture' || steps.operation.outputs.mode == 'validate') && steps.fetcher.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
          cargo +1.89.0 fmt --check --manifest-path packages/source-fetch/Cargo.toml
          cargo +1.89.0 clippy --locked --release --manifest-path packages/source-fetch/Cargo.toml -- -D warnings
          cargo +1.89.0 test --locked --release --manifest-path packages/source-fetch/Cargo.toml
          cargo +1.89.0 build --locked --release --manifest-path packages/source-fetch/Cargo.toml --bin source-fetch
      - name: Verify native concurrency and request pacing on loopback
        if: (steps.operation.outputs.mode == 'capture' || steps.operation.outputs.mode == 'validate') && steps.fetcher.outputs.cache-hit != 'true'
        env:
          SOURCE_FETCH_BINARY: ${{ github.workspace }}/packages/source-fetch/target/release/source-fetch
        run: python -m pytest -q tests/test_rust_fetch_native.py tests/test_rust_fetch_size_admission_native.py
      - uses: actions/cache/save@v4
        if: (steps.operation.outputs.mode == 'capture' || steps.operation.outputs.mode == 'validate') && steps.fetcher.outputs.cache-hit != 'true'
        with:
          path: packages/source-fetch/target/release/source-fetch
          key: ${{ steps.fetcher.outputs.cache-primary-key }}
      - name: Record and check capture source revision
        env:
          EXPECTED_SOURCE_DIGEST: ${{ inputs.expected_source_digest }}
        run: |
          python .github/scripts/capture-source-manifest.py
          python - <<'PYCODE'
          import json, os
          expected = os.environ.get('EXPECTED_SOURCE_DIGEST')
          actual = json.load(open('raw-capture-source-manifest.json'))['source_digest']
          if expected and expected != actual:
              raise SystemExit(f'Capture source mismatch: expected {expected}, found {actual}')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: raw-capture-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: raw-capture-source-manifest.json
      - name: Verify previous capture checkpoint before writes
        if: steps.operation.outputs.mode == 'capture' && inputs.previous_summary != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PREVIOUS_SUMMARY: ${{ inputs.previous_summary }}
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          summary = json.loads(os.environ['PREVIOUS_SUMMARY'])
          if summary.get('bucket', 'congressional-tech-raw') != 'congressional-tech-raw':
              raise SystemExit('Previous capture bucket does not match the capture destination')
          Path('previous-capture-summary.json').write_text(json.dumps(summary))
          PYCODE
          python .github/scripts/verify-capture-run.py --summary previous-capture-summary.json --output previous-capture-verification.json
      - name: Capture sources or rebuild document tables
        id: sync
        if: steps.operation.outputs.mode != 'validate'
        env:
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ZYTE_TOKEN: ${{ steps.operation.outputs.mode == 'capture' && secrets.ZYTE_TOKEN || '' }}
          SYNC_MODE: ${{ steps.operation.outputs.mode }}
          REPAIR: ${{ inputs.repair || 'false' }}
          INSPECT_BODIES: ${{ inputs.inspect_bodies || 'false' }}
          CAPTURE_LIMIT: ${{ inputs.limit }}
          INITIAL_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.initial_only }}
          CAPTURE_TRANSPORT: ${{ inputs.transport || 'auto' }}
        run: |
          seeds=()
          for path in \
            pipeline-data/congress_meetings.jsonl.gz \
            pipeline-data/gpo-evidence.jsonl.gz \
            pipeline-data/meeting-inventory/house.json.gz \
            pipeline-data/meeting-inventory/house-sites.json.gz \
            pipeline-data/meeting-inventory/senate.json.gz; do
            if [ -f "$path" ]; then seeds+=(--seed "$path"); fi
          done
          args=(--bucket congressional-tech-raw --index-workers 2 --summary raw-capture-summary.json)
          case "$SYNC_MODE" in
            update) args+=(--update-only) ;;
            rebuild) args+=(--rebuild-only) ;;
            capture)
              if ! [[ "$CAPTURE_LIMIT" =~ ^[1-9][0-9]{0,4}$ ]] || (( CAPTURE_LIMIT < 1 || CAPTURE_LIMIT > 20000 )); then
                echo 'Capture limit must be between 1 and 20000' >&2; exit 1
              fi
              args+=(--capture-only --fetcher-binary "$GITHUB_WORKSPACE/packages/source-fetch/target/release/source-fetch"
                --transport "$CAPTURE_TRANSPORT" --limit "$CAPTURE_LIMIT"
                --files-per-second 60 --workers 80 --download-workers 48 --metadata-workers 3
                --max-buffer-mib 2048 --max-spool-mib 5120 --max-seconds 18000 --max-file-mib 64)
              if [ "${INITIAL_ONLY:-true}" = true ]; then args+=(--initial-only); fi
              ;;
            *) echo "Unsupported operation: $SYNC_MODE" >&2; exit 1 ;;
          esac
          if [ "${REPAIR:-false}" = "true" ]; then args+=(--repair); fi
          if [ "${INSPECT_BODIES:-false}" = "true" ]; then args+=(--inspect-bodies); fi
          guard=()
          if [ "$SYNC_MODE" = capture ]; then
            guard=(python .github/scripts/capture-memory-guard.py --output raw-capture-memory.json --)
          fi
          "${guard[@]}" raw-source-sync "${args[@]}" "${seeds[@]}"
          test -s raw-capture-summary.json
      - name: Verify completed capture checkpoint
        if: steps.operation.outputs.mode == 'capture'
        env:
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python .github/scripts/verify-capture-run.py --summary raw-capture-summary.json --output raw-capture-verification.json
      - name: Show operation summary
        if: ${{ always() }}
        env:
          SYNC_MODE: ${{ steps.operation.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          CODE_REVISION: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          {
            echo '### Raw source capture and document tables'
            echo "Operation: ${SYNC_MODE:-unresolved}; trigger: $EVENT_NAME"
            echo "Code revision: $CODE_REVISION"
            if [ -d pipeline-data/.git ]; then
              echo "Seed revision: $(git -C pipeline-data rev-parse HEAD)"
            fi
            echo "Job status: $JOB_STATUS; sync step: ${SYNC_OUTCOME:-not run}"
            if [ "$SYNC_MODE" = capture ]; then
              echo 'Capture mode saves receipts and retry state; document tables are updated by a separate rebuild.'
            fi
            if [ "$SYNC_MODE" = validate ]; then
              echo 'Validation only; no archive reads or writes.'
            elif [ -s raw-capture-summary.json ]; then
              echo '```json'
              cat raw-capture-summary.json
              echo '```'
            else
              echo 'No completed operation summary was written. Check the failed step; this operation is unverified.'
            fi
            if [ -s raw-capture-summary.progress.json ]; then
              echo 'Last recorded progress (a running status may mean the process was interrupted):'
              echo '```json'
              cat raw-capture-summary.progress.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: raw-capture-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            raw-capture-summary.json
            raw-capture-summary.progress.json
            core-benchmark-smoke.json
            raw-capture-source-manifest.json
            raw-capture-memory.json
            raw-capture-verification.json
            previous-capture-summary.json
            previous-capture-verification.json
          if-no-files-found: ignore

  finalize:
    needs: capture
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install 'boto3>=1.40,<2'
      - name: Finalize retained progress on a separate worker
        env:
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CAPTURE_RESULT: ${{ needs.capture.result }}
        run: python .github/scripts/finalize-raw-source.py
