name: Deploy website to Pages

# Filename data publishes independently to R2. Pages deploys interface changes
# and the existing Explorer publication.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".node-version"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/actions/setup-python-project/**"
      - ".github/actions/setup-node-project/**"
      - ".github/actions/setup-publication-browser/**"
      - ".github/scripts/verify-built-filename-worker.sh"
      - ".github/workflows/deploy-pages.yml"
      - "packages/congress_shared/**"
      - "packages/viewer_publication/src/viewer_publication/filename_*.py"
      - "scripts/publication/filename-test-fixture.py"
      - "scripts/publication/publish-filename-viewer.py"
  workflow_dispatch:
    inputs:
      code_revision:
        description: Verified site commit; must match this workflow's main revision
        required: true
        type: string
      pipeline_revision:
        description: pipeline-data commit containing the verified Explorer publication
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  revision-mismatch:
    if: github.event_name == 'workflow_dispatch' && inputs.code_revision != github.sha
    runs-on: ubuntu-24.04
    steps:
      - name: Record why this publication cannot deploy the current workflow
        env:
          SITE_REVISION: ${{ inputs.code_revision }}
          WORKFLOW_REVISION: ${{ github.sha }}
          PIPELINE_REVISION: ${{ inputs.pipeline_revision }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          receipt = {'status': 'skipped', 'reason': 'site_and_workflow_revisions_differ',
                     'site_revision': os.environ['SITE_REVISION'],
                     'workflow_revision': os.environ['WORKFLOW_REVISION'],
                     'pipeline_revision': os.environ['PIPELINE_REVISION']}
          print(json.dumps(receipt, sort_keys=True))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              'Pages deployment skipped because the producer selected a different site revision. '
              'The verified pipeline snapshot remains retained. A current main push can deploy it.\n\n'
              + '```json\n' + json.dumps(receipt, indent=2) + '\n```\n')
          PYTHON
  build:
    # An older exporter may finish after main advances. Its checkout must not
    # run a newer workflow or replace an already deployed newer interface.
    if: github.event_name != 'workflow_dispatch' || inputs.code_revision == github.sha
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Check out the published browser snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pipeline_revision || 'pipeline-data' }}
          path: pipeline-data
      - uses: ./.github/actions/setup-python-project
      - name: Verify and stage only published browser files
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          from committee_explorer.browser import verify
          source = Path('pipeline-data/committee-explorer/public')
          target = Path('apps/site/public/data/explorer')
          _, _, manifest = verify(source)
          if not any(p.media_type == 'application/vnd.apache.parquet' for p in manifest.partitions):
              raise ValueError('Browser publication must use Parquet partitions')
          shutil.copytree(source, target, dirs_exist_ok=True)
          PYTHON
      - uses: ./.github/actions/setup-node-project
      - name: Verify review controls and static reader
        working-directory: apps/site
        run: npm run test:explorer
      - name: Build Astro site
        working-directory: apps/site
        run: npm run build
      - name: Smoke test the built filename page
        working-directory: apps/site
        run: npm run test:built-filenames
      - uses: ./.github/actions/setup-publication-browser
      - name: Require the built filename worker against the real selected native catalog
        timeout-minutes: 5
        run: bash .github/scripts/verify-built-filename-worker.sh
      - name: Retain built-site filename worker verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filename-worker-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/filename-worker-built.json
            ${{ runner.temp }}/filename-worker-server.log
          if-no-files-found: ignore
      - name: Enforce the Pages publication size limit
        run: python .github/scripts/publication-budget.py apps/site/dist --total-limit 1000000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-node-project
      - uses: ./.github/actions/setup-publication-browser
      - name: Restore the built-site filename selection
        uses: actions/download-artifact@v5
        with:
          name: filename-worker-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/filename-worker-built
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Require the deployed filename worker and the same selected publication
        timeout-minutes: 5
        env:
          PAGES_BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          node apps/site/scripts/verify-live-publication.mjs \
            --viewer-url https://congressional-data.spicygov.ai/viewer-publications/manifest.json \
            --pages-url "${PAGES_BASE%/}/dashboard/" \
            --review-descriptor apps/site/document-review-publication.json \
            --require-native-worker true \
            --expected-observation "$RUNNER_TEMP/filename-worker-built/filename-worker-built.json" \
            --output "$RUNNER_TEMP/filename-worker-deployed.json"
      - name: Retain deployed filename worker verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filename-worker-deployed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/filename-worker-deployed.json
          if-no-files-found: ignore
