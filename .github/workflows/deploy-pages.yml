name: Deploy website to Pages

# Site-only changes reuse the published catalog; data publication also dispatches
# a deployment with exact code and data revisions.
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
    inputs:
      code_revision:
        description: Site code commit verified by the publication workflow
        required: true
        type: string
      pipeline_revision:
        description: pipeline-data commit containing the verified Explorer publication
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.code_revision || github.sha }}
      - name: Check out the published browser snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pipeline_revision || 'pipeline-data' }}
          path: pipeline-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install publication verifier
        run: >-
          pip install -e packages/house-naming -e packages/committee_meeting -e packages/congress_shared
          -e packages/youtube_api -e packages/congress_api -e apps/committee_youtube
      - name: Verify and stage only published browser files
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          from committee_explorer.browser import verify
          from committee_explorer.parquet import migrate
          source = Path('pipeline-data/committee-explorer/public')
          target = Path('apps/site/public/data/explorer')
          _, _, manifest = verify(source)
          if any(p.media_type == 'application/vnd.apache.parquet' for p in manifest.partitions):
              shutil.copytree(source, target, dirs_exist_ok=True)
          else:
              # First rollout can reuse the existing catalog without reassembly.
              migrate(source, target)
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/site
        run: npm install --no-audit --no-fund
      - name: Build Astro site
        working-directory: apps/site
        run: npm run build
      - name: Enforce the Pages publication size limit
        run: python .github/scripts/publication-budget.py apps/site/dist --total-limit 1000000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
