name: Update Events from YouTube

on:
  schedule:
    - cron: "0 0 * * 0" # 12:00 AM Sunday each week
  # pull_request intentionally omitted: this job does a real YouTube API fetch
  # (burns quota, ~10min devcontainer build, and fails on fork PRs with no
  # secret). Smoke-test tooling changes with workflow_dispatch instead.
  workflow_dispatch:

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Run in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          # post-create.sh installs the Python package graph editable
          # (congress_shared -> youtube_api/congress_api -> committee_youtube),
          # which registers the youtube-fetch / youtube-analyze console scripts
          # into ~/.local/bin. We put that on PATH before invoking them.
          #
          # The committee->handle CSV and congress metadata now ship inside the
          # shared package, so the tools find their data by default. We still
          # pass --channels-csv-path explicitly (finished layout) and write the
          # TinyDBs + report into apps/committee_youtube/data so the "Upload to
          # GitHub" step below can commit them.
          runCmd: |
            export PATH="$HOME/.local/bin:$PATH"

            CSV="packages/congress_shared/src/congress_shared/youtube/youtube-accounts.csv"
            DATA_DIR="apps/committee_youtube/data"
            mkdir -p "$DATA_DIR"

            # YouTube Fetch
            youtube-fetch \
              --youtube-api-key ${{ secrets.YOUTUBE_DATA_API_KEY }} \
              --channels-csv-path "$CSV" \
              --tinydb_dir "$DATA_DIR"

            # YouTube Analyze
            youtube-analyze \
              --channels-csv-path "$CSV" \
              --tinydb_dir "$DATA_DIR" \
              --output-path "$DATA_DIR/youtube_event_id_report.csv"

      - name: Upload to GitHub
        # On pull_request we run fetch/analyze as a smoke check but do not
        # commit/push (PRs, especially from forks, can't push).
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/committee_youtube/data/*
          git commit -m "Updated Events from YouTube" || echo "No changes"
          # Resilient push: another scheduled workflow may push to main
          # between checkout and now (non-fast-forward). Rebase and retry.
          for attempt in 1 2 3; do
            git push && break
            echo "push rejected (attempt $attempt) -- rebasing on origin/main"
            git pull --rebase --autostash origin main
          done
