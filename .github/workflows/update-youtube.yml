name: Update Events from YouTube

on:
  schedule:
    - cron: "0 0 * * 0" # 12:00 AM Sunday each week
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Run in Dev Container
        uses: devcontainers/ci@v0.3
        with:
          # The console scripts (youtube-fetch / youtube-analyze) are provided
          # by the committee_youtube package (apps/committee_youtube), which the
          # devcontainer's post-create.sh installs editable with `pip install
          # --user -e`. That puts the scripts in ~/.local/bin, so the runCmd
          # below prepends it to PATH (the non-interactive CI shell does not
          # source the interactive .bashrc that normally adds it).
          runCmd: |
            export PATH="$HOME/.local/bin:$PATH"

            # YouTube Fetch
            cd apps/committee_youtube
            youtube-fetch --youtube-api-key ${{ secrets.YOUTUBE_DATA_API_KEY }} --channels-csv-path src/congress_youtube/youtube/youtube-accounts.csv

            # YouTube Analyze
            youtube-analyze --channels-csv-path src/congress_youtube/youtube/youtube-accounts.csv

      - name: Upload to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/committee_youtube/data/*
          git commit -m "Updated Events from YouTube" || echo "No changes"
          git push
