name: Publish Committee Explorer data

# Collection writes several snapshots. Publish only after the whole run settles;
# Source and exporter changes rebuild from saved inputs. Site-only changes deploy separately.
on:
  push:
    branches: [main]
    paths:
      - "apps/committee_youtube/**"
      - "packages/committee_meeting/**"
      - "packages/congress_api/**"
      - "packages/congress_shared/**"
      - "packages/youtube_api/**"
      - ".github/scripts/**"
      - ".github/workflows/publish-explorer.yml"
      - ".github/workflows/update-data.yml"
  workflow_run:
    workflows: ["Update committee data"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # Read completed job conclusions and dispatch the verified Pages build.

# Matches update-data.yml so publication cannot read a partially saved run.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Check out retained pipeline data
        uses: actions/checkout@v5
        with:
          ref: pipeline-data
          path: pipeline-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install local model, source packages and exporter
        run: >-
          pip install -e packages/committee_meeting -e packages/congress_shared
          -e packages/youtube_api -e packages/congress_api -e apps/committee_youtube

      - name: Retain completed collection-job outcomes
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$COLLECTION_RUN_ID/jobs?filter=latest&per_page=100" \
            > "$RUNNER_TEMP/collection-jobs.json"
          python .github/scripts/explorer-attempts.py \
            --event "$GITHUB_EVENT_PATH" --jobs "$RUNNER_TEMP/collection-jobs.json" \
            --output pipeline-data/committee-explorer/attempts.json

      - name: Restore persistent IDs and issue history
        run: |
          python .github/scripts/offline-python.py -m committee_explorer.state unpack \
            --input pipeline-data/committee-explorer/state \
            --output "$RUNNER_TEMP/committee-explorer-state"

      - name: Export complete retained inputs without acquisition
        env:
          DATA_DIR: apps/committee_youtube/data
        run: |
          args=()
          if [[ -f pipeline-data/committee-explorer/attempts.json ]]; then
            args+=(--attempts pipeline-data/committee-explorer/attempts.json)
          fi
          if [[ -f pipeline-data/gpo-evidence.jsonl.gz ]]; then
            args+=(--gpo-evidence-path pipeline-data/gpo-evidence.jsonl.gz)
          fi
          if [[ -f pipeline-data/congress_committees.jsonl.gz ]]; then
            args+=(--committees-path pipeline-data/congress_committees.jsonl.gz)
          fi
          python .github/scripts/offline-python.py -m committee_explorer.export \
            --format parquet \
            --reuse-from pipeline-data/committee-explorer/public \
            --meetings pipeline-data/congress_meetings.jsonl.gz \
            --house-state pipeline-data/meeting-inventory/house.json.gz \
            --senate-state pipeline-data/meeting-inventory/senate.json.gz \
            --inventory-state pipeline-data/meeting-inventory/inventory.json.gz \
            --youtube-dir pipeline-data/youtube \
            --gpo-path "$DATA_DIR/gpo_hearings.csv" \
            --video-matches-path "$DATA_DIR/gpo_hearing_videos.csv" \
            --recordings-path "$DATA_DIR/meeting_recordings_found.csv" \
            --recovered-witnesses "$DATA_DIR/meeting_witnesses.csv" \
            --state-dir "$RUNNER_TEMP/committee-explorer-state" \
            --output-dir "$RUNNER_TEMP/committee-explorer-full" \
            --revision "$(git -C pipeline-data rev-parse HEAD)" "${args[@]}"

      - name: Build and verify the browser publication
        run: |
          python .github/scripts/offline-python.py -m committee_explorer.browser \
            --input "$RUNNER_TEMP/committee-explorer-full" \
            --output pipeline-data/committee-explorer/public
          python .github/scripts/offline-python.py -m committee_explorer.browser \
            --verify pipeline-data/committee-explorer/public

      - name: Pack persistent state and enforce Git file limits
        run: |
          python .github/scripts/offline-python.py -m committee_explorer.state pack \
            --input "$RUNNER_TEMP/committee-explorer-state" \
            --output pipeline-data/committee-explorer/state
          python .github/scripts/publication-budget.py pipeline-data --file-limit 100000000

      - name: Save IDs, history, receipts and browser files on pipeline-data
        run: .github/scripts/save-pipeline-data.sh "Committee Explorer publication"

      - name: Deploy this verified publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main \
            -f "code_revision=$(git rev-parse HEAD)" \
            -f "pipeline_revision=$(git -C pipeline-data rev-parse HEAD)"
