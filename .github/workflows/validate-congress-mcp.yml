name: Validate Congress MCP
on:
  pull_request:
    paths:
      - 'apps/explorer_mcp/**'
      - '.agents/plugins/marketplace.json'
      - '.claude-plugin/marketplace.json'
      - '.github/workflows/publish-congress-mcp.yml'
      - 'model/**'
      - 'packages/viewer_publication/**'
      - 'packages/congress_api/**'
      - 'packages/docspec_client/**'
      - '.github/actions/setup-python-project/**'
      - '.github/actions/setup-local-job-runtime/**'
      - '.github/scripts/setup-native-runtime.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/plans/phase-2-annex-20261028.md'
      - 'scripts/dev.py'
      - 'test-suites.toml'
      - '.python-version'
      - '.github/workflows/validate-congress-mcp.yml'
  workflow_dispatch:
    inputs:
      export_container_image:
        description: Retain the validated Linux/amd64 image for a hosted release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --project apps/explorer_mcp
      - run: apps/explorer_mcp/.venv/bin/python scripts/dev.py test explorer-mcp -- -q
      - run: uv build apps/explorer_mcp --out-dir dist
      - run: uvx --from twine twine check --strict dist/*
      - run: apps/explorer_mcp/.venv/bin/python apps/explorer_mcp/scripts/check_distribution.py dist/*.whl
      - run: python3 apps/explorer_mcp/scripts/build_desktop.py --check --output-dir dist
      - run: npx --yes @anthropic-ai/mcpb@2.1.2 validate apps/explorer_mcp/manifest.json
      - run: npx --yes @anthropic-ai/claude-code@2.1.314 plugin validate --strict apps/explorer_mcp
      - run: npx --yes @anthropic-ai/claude-code@2.1.314 plugin validate --strict .
      - run: apps/explorer_mcp/.venv/bin/python apps/explorer_mcp/scripts/check_desktop.py dist --wheel dist/*.whl

  cloudflare:
    name: Cloudflare gateway and container build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/explorer_mcp/cloudflare
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/explorer_mcp/cloudflare/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm run types && git diff --exit-code -- worker-configuration.d.ts
      - run: npm run typecheck && npm test
      - name: Validate the Worker bundle and container image
        env:
          EXPORT_IMAGE: ${{ inputs.export_container_image }}
        run: |
          if [ "$EXPORT_IMAGE" = true ]; then
            # Wrangler removes its temporary tag after the dry run. Add a second
            # tag to the same Docker build so the validated image can be saved.
            export CONGRESS_MCP_IMAGE="congress-explorer-mcp:git-$GITHUB_SHA"
            export WRANGLER_DOCKER_BIN="$RUNNER_TEMP/export-congress-mcp-docker"
            cat > "$WRANGLER_DOCKER_BIN" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$1" = build ]; then
            exec docker build --tag "$CONGRESS_MCP_IMAGE" "${@:2}"
          fi
          exec docker "$@"
          SH
            chmod +x "$WRANGLER_DOCKER_BIN"
          fi
          npx wrangler deploy --dry-run --outdir dist
      - name: Verify and export the validated image
        if: inputs.export_container_image
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          image="congress-explorer-mcp:git-$GITHUB_SHA"
          platform=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")
          test "$platform" = linux/amd64
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          version=$(jq -er '.version' ../server.json)
          test "$(docker run --rm --network none --entrypoint congress-explorer-mcp "$image" --version)" = "congress-explorer-mcp $version"
          publication=$(jq -er '.vars.PUBLICATION' wrangler.jsonc)
          mkdir "$RUNNER_TEMP/congress-mcp-container"
          cd "$RUNNER_TEMP/congress-mcp-container"
          docker image save "$image" | gzip > image.tar.gz
          jq -n --arg source_sha "$GITHUB_SHA" --arg publication "$publication" \
            --arg version "$version" --arg image "$image" --arg image_id "$image_id" \
            --arg platform "$platform" '{source_sha:$source_sha, publication:$publication,
            version:$version, image:$image, image_id:$image_id, platform:$platform}' > image.json
          sha256sum image.tar.gz image.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: inputs.export_container_image
        with:
          name: congress-mcp-container-linux-amd64
          path: ${{ runner.temp }}/congress-mcp-container/
          if-no-files-found: error
          compression-level: 0

  native-consumer:
    name: Native producer to MCP stdio
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - uses: ./.github/actions/setup-local-job-runtime
        with:
          artifact: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          credentials: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          account-id: "174055408ff1560e60601c4d12c561c4"
      - name: Build and verify the real native phase 2 fixture
        run: |
          .venv/bin/python scripts/dev.py test production-offline \
            --path packages/viewer_publication/tests/test_phase2_model_entities.py::test_phase2_entities_meetings_witnesses_recordings_and_spicy_projections \
            --path packages/viewer_publication/tests/test_phase1_model_profile.py \
            --path packages/viewer_publication/tests/test_archive_maintenance.py \
            --path packages/congress_api/tests/test_filename_readings.py::test_repaired_bill_filename_dates_publish \
            --path packages/viewer_publication/tests/test_page_metadata_model.py::test_shared_html_reader_fixture \
            -- --basetemp "$RUNNER_TEMP/native-mcp" --junitxml="$RUNNER_TEMP/native-producer.xml"
      - name: Sync the independent DuckDB 2 consumer
        run: uv sync --locked --project apps/explorer_mcp
      - name: Verify native output through the actual MCP stdio client
        run: |
          apps/explorer_mcp/.venv/bin/python scripts/dev.py test explorer-mcp \
            --path apps/explorer_mcp/tests/test_native_release.py \
            -- --native-fixture-root="$RUNNER_TEMP/native-mcp" --junitxml="$RUNNER_TEMP/native-consumer.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-congress-mcp-checks
          path: |
            ${{ runner.temp }}/native-producer.xml
            ${{ runner.temp }}/native-consumer.xml
