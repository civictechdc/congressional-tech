name: Archive publish, backfill and maintenance

# The nightly publish runs on the owner's Mac (scripts/nightly_publish.py, owner decision
# 2026-11-04); a hosted publish is a manual dispatch only, so the two never write together.
# The weekly maintenance schedule is off until the hosted job has a measured disk budget for
# `maintenance` (ct-fskn): every scheduled run was refused before doing any work.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run the committed job specification
        type: choice
        options: [publish, backfill, maintenance]
        default: publish
        required: true

permissions:
  contents: read

# One workflow-level group protects all lake writers and release retention.
concurrency:
  group: raw-source-mirror
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: archive-publish
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0  # gate 5 checks each producing commit is reachable from HEAD
      - uses: ./.github/actions/setup-python-project
      - name: Install the locked corpus text preparation runtime
        run: uv sync --frozen --python 3.12.13 --project apps/explorer_mcp
      - name: Admit the model binding before runtime or storage access
        id: publisher_binding
        run: .venv/bin/python -I .github/scripts/run-archive-job.py publish --check-binding --github-output "$GITHUB_OUTPUT"
      - name: Fetch the spicy-regs tables the model spec pins
        run: .venv/bin/python -I -m viewer_publication.spicy_regs_inputs --model-spec model/jobs/publish-model.json
      - name: Install and verify the pinned publish runtime
        env:
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: .venv/bin/python -I .github/scripts/setup-native-runtime.py --directory "$RUNNER_TEMP/docspec-runtime" --output "$RUNNER_TEMP/native-runtime-check.json" --github-env "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node-project
      - uses: ./.github/actions/setup-publication-browser
      - name: Build the archive site for the local contract
        working-directory: apps/site
        run: npm run build
      # Gate 3 (ct-tk10): the publisher runs the raw-to-release end-to-end test on this
      # credential-free local runtime (DOCSPEC_JOB_CONFIG) before any remote runtime or SDK.
      - uses: ./.github/actions/setup-local-job-runtime
        with:
          artifact: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          credentials: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Run the single publisher with its local contract and HTTPS canary gates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .venv/bin/python -I .github/scripts/run-archive-job.py publish
      - name: Retain run evidence (access follows repository)
        if: ${{ always() && steps.publisher_binding.outputs.publisher_work != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: archive-publish-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ steps.publisher_binding.outputs.publisher_work }}/outgoing-pointer.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/outgoing-pointer.response.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/contract.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/canary.json

  backfill:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'backfill'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: archive-backfill
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - name: Admit the backfill binding before runtime or storage access
        run: .venv/bin/python -I .github/scripts/run-archive-job.py backfill --check-binding
      - name: Install and verify the pinned backfill runtime
        env:
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: .venv/bin/python -I .github/scripts/setup-native-runtime.py --directory "$RUNNER_TEMP/docspec-runtime" --output "$RUNNER_TEMP/native-runtime-check.json" --github-env "$GITHUB_ENV"
      - name: Run the committed producer backfill specification
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .venv/bin/python -I .github/scripts/run-archive-job.py backfill

  maintenance:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'maintenance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: archive-maintenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - name: Admit the maintenance binding before runtime or storage access
        run: .venv/bin/python -I .github/scripts/run-archive-job.py maintenance --check-binding
      - name: Install and verify the pinned maintenance runtime
        env:
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: .venv/bin/python -I .github/scripts/setup-native-runtime.py --directory "$RUNNER_TEMP/docspec-runtime" --output "$RUNNER_TEMP/native-runtime-check.json" --github-env "$GITHUB_ENV" --host-limits .github/docspec-maintenance-limits.json
      - name: Run raw checks, retained receipt evidence and catalog maintenance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .venv/bin/python -I .github/scripts/run-archive-job.py maintenance
