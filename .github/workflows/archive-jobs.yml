name: Archive publish, backfill and maintenance

# Nightly publication runs automatically in GitHub Actions when "Capture archive sources"
# completes on main (serialized by raw-source-mirror; pause via vars.ARCHIVE_NIGHTLY_DISABLED == 'true'),
# and via workflow_dispatch.
# The weekly maintenance schedule is off until the hosted job has a measured disk budget for
# `maintenance` (ct-fskn): every scheduled run was refused before doing any work.
on:
  workflow_run:
    workflows: ["Capture archive sources"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Run the committed job specification
        type: choice
        options: [publish, backfill, maintenance]
        default: publish
        required: true

permissions:
  contents: read
  actions: read  # to find the newest validated commit

# One workflow-level group protects all lake writers and release retention.
concurrency:
  group: raw-source-mirror
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion != 'cancelled' &&
         github.event.workflow_run.conclusion != 'skipped' &&
         vars.ARCHIVE_NIGHTLY_DISABLED != 'true')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: archive-publish
    steps:
      # Production runs the newest commit of main that passed validation, never an untested tip
      # (run 44087092120's first attempt ran a commit whose validation had failed). A capture and
      # the publish after it both take this commit, so a producing commit is an ancestor of the
      # publisher's, as gate 5 requires.
      - name: Select the newest validated commit of main
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          get() { curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }
          sha=$(get "$api/actions/workflows/validate-explorer.yml/runs?branch=main&event=push&status=success&per_page=1" | jq -er '.workflow_runs[0].head_sha')
          # A push that touches only tickets, docs or Markdown runs no validation. When nothing else
          # has landed since the validated commit, main's tip is the same code: take it, so a
          # producer record written at that tip is still an ancestor of this checkout (gate 5).
          tip=$(get "$api/compare/$sha...main" | jq -er 'if (.files | length) < 300 and all(.files[]; .filename | test("^\\.tickets/|\\.md$") or (test("^docs/") and (test("^docs/experiments/") | not))) then (.commits[-1].sha // .base_commit.sha) else empty end' || true)
          sha=${tip:-$sha}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated commit: $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.validated.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0  # gate 5 checks each producing commit is reachable from HEAD
      - uses: ./.github/actions/setup-python-project
        with:
          tesseract: true
      - name: Admit the model binding before runtime or storage access
        id: publisher_binding
        run: .venv/bin/python -I .github/scripts/run-archive-job.py publish --check-binding --github-output "$GITHUB_OUTPUT"
      - name: Fetch the spicy-regs tables the model spec pins
        run: .venv/bin/python -I -m viewer_publication.spicy_regs_inputs --model-spec model/jobs/publish-model.json
      - name: Install and verify the pinned publish runtime
        env:
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: .venv/bin/python -I .github/scripts/setup-native-runtime.py --directory "$RUNNER_TEMP/docspec-runtime" --output "$RUNNER_TEMP/native-runtime-check.json" --github-env "$GITHUB_ENV"
      - uses: ./.github/actions/setup-node-project
      - uses: ./.github/actions/setup-publication-browser
      - name: Build the archive site for the local contract
        working-directory: apps/site
        run: npm run build
      # Gate 3 (ct-tk10): the publisher runs the raw-to-release end-to-end test on this
      # credential-free local runtime (DOCSPEC_JOB_CONFIG) before any remote runtime or SDK.
      - uses: ./.github/actions/setup-local-job-runtime
        with:
          artifact: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          credentials: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # ct-31qi: a re-run after a gate stop resumes the built candidate at the gates instead of
      # rebuilding it (about 22 minutes and 10 GiB). The run's identity is known only after the daily
      # ingest, so this restores the newest kept candidate by prefix (no key equals this run's) and
      # the publisher decides: it resumes a candidate whose inputs, definitions and selected release
      # are this run's, and otherwise deletes it and builds fresh. Paths: kept_candidate_paths in
      # archive_publish_job.py, about 178 MiB (release with manifest 170, native result 7, evidence 0.6).
      - name: Restore the newest kept publish candidate
        uses: actions/cache/restore@v6
        with:
          key: archive-publish-candidate-run-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: archive-publish-candidate-
          path: |
            output/archive-publish/completed-model.json
            output/archive-publish/base-release-record.json
            output/archive-release
            output/archive-model/result.json
            output/archive-model/evidence/recording_video_links.parquet
      - name: Run the single publisher with its local contract and HTTPS canary gates
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .venv/bin/python -I .github/scripts/run-archive-job.py publish --keep-candidate
      # Saved whenever a completed model exists, above all when the gates stopped the run. The key is
      # the checkpoint's content, so a resumed run saves nothing new. GitHub evicts an entry unused
      # for 7 days and the oldest first past the repository's 10 GB; only the newest is ever restored.
      - name: Keep the built candidate for a re-run
        if: ${{ always() && hashFiles('output/archive-publish/completed-model.json') != '' }}
        uses: actions/cache/save@v6
        continue-on-error: true  # A lost save costs the next re-run one rebuild, nothing more.
        with:
          key: archive-publish-candidate-${{ hashFiles('output/archive-publish/completed-model.json') }}
          path: |
            output/archive-publish/completed-model.json
            output/archive-publish/base-release-record.json
            output/archive-release
            output/archive-model/result.json
            output/archive-model/evidence/recording_video_links.parquet
      - name: Publish incremental body_text and derived/body_text/current.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          rm -rf output/archive-model output/archive-daily/receipts output/archive-daily/qualification-cache apps/site/dist apps/site/node_modules ~/.cache/ms-playwright
          .venv/bin/python -I scripts/archive_watchdog.py \
            --rss-gb 13 \
            --min-disk-gb 5 \
            --min-available-gb 0 \
            --report "$RUNNER_TEMP/body-text-watchdog.json" \
            --timeline \
            -- .venv/bin/python -I -m viewer_publication.body_text_publish \
              --work "$RUNNER_TEMP/body-text-publish" \
              --release-dir output/archive-release \
              --parser-workers 3
      - name: Retain run evidence (access follows repository)
        if: ${{ always() && steps.publisher_binding.outputs.publisher_work != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: archive-publish-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ steps.publisher_binding.outputs.publisher_work }}/outgoing-pointer.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/outgoing-pointer.response.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/contract.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/canary.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/completed-model.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/model-intent.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/candidate-*/release-gate.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/candidate-*/automatic/automatic-trace.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/candidate-*/data-only-night.json
            ${{ steps.publisher_binding.outputs.publisher_work }}/candidate-*/meeting-updates.*
            output/archive-daily/daily-summary.json
            output/archive-release/manifest.json
            ${{ runner.temp }}/*-disk-admission.json
            ${{ runner.temp }}/*-watchdog.json
            ${{ runner.temp }}/*-watchdog.timeline.jsonl
      # ct-pz32: the hosted MCP follows the pointer by itself (apps/explorer_mcp/cloudflare). It
      # re-reads the pointer within a minute and a fresh container needs up to 90 s, so a release
      # it still does not serve after five minutes turns this run red.
      - name: Confirm the hosted MCP serves the selected release
        env:
          ARCHIVE_POINTER_URL: ${{ vars.ARCHIVE_POINTER_URL }}
          MCP_READY_URL: https://congress-explorer-mcp.mdeeb.workers.dev/ready
        run: |
          release=$(curl -fsS "$ARCHIVE_POINTER_URL" | jq -er .release_id)
          for attempt in $(seq 1 30); do
            served=$(curl -sS -m 120 "$MCP_READY_URL" | jq -r '.release_id // empty' 2>/dev/null || true)
            if [ "$served" = "$release" ]; then echo "Hosted MCP serves $release"; exit 0; fi
            sleep 10
          done
          echo "Hosted MCP serves '$served'; the pointer names $release" >&2
          exit 1

  backfill:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'backfill'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: archive-backfill
    steps:
      # Production runs the newest commit of main that passed validation, never an untested tip
      # (run 44087092120's first attempt ran a commit whose validation had failed). A capture and
      # the publish after it both take this commit, so a producing commit is an ancestor of the
      # publisher's, as gate 5 requires.
      - name: Select the newest validated commit of main
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          get() { curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }
          sha=$(get "$api/actions/workflows/validate-explorer.yml/runs?branch=main&event=push&status=success&per_page=1" | jq -er '.workflow_runs[0].head_sha')
          # A push that touches only tickets, docs or Markdown runs no validation. When nothing else
          # has landed since the validated commit, main's tip is the same code: take it, so a
          # producer record written at that tip is still an ancestor of this checkout (gate 5).
          tip=$(get "$api/compare/$sha...main" | jq -er 'if (.files | length) < 300 and all(.files[]; .filename | test("^\\.tickets/|\\.md$") or (test("^docs/") and (test("^docs/experiments/") | not))) then (.commits[-1].sha // .base_commit.sha) else empty end' || true)
          sha=${tip:-$sha}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated commit: $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.validated.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0  # gate 5 checks each producing commit is reachable from HEAD
      - uses: ./.github/actions/setup-python-project
      - name: Admit the backfill binding before runtime or storage access
        run: .venv/bin/python -I .github/scripts/run-archive-job.py backfill --check-binding
      - name: Install and verify the pinned backfill runtime
        env:
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: .venv/bin/python -I .github/scripts/setup-native-runtime.py --directory "$RUNNER_TEMP/docspec-runtime" --output "$RUNNER_TEMP/native-runtime-check.json" --github-env "$GITHUB_ENV"
      - name: Run the committed producer backfill specification
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .venv/bin/python -I .github/scripts/run-archive-job.py backfill
      - name: Retain backfill run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-backfill-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            output/archive-backfill/backfill-report.json
            ${{ runner.temp }}/*-disk-admission.json
            ${{ runner.temp }}/*-watchdog.json
            ${{ runner.temp }}/*-watchdog.timeline.jsonl

  maintenance:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'maintenance'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: archive-maintenance
    steps:
      # Production runs the newest commit of main that passed validation, never an untested tip
      # (run 44087092120's first attempt ran a commit whose validation had failed). A capture and
      # the publish after it both take this commit, so a producing commit is an ancestor of the
      # publisher's, as gate 5 requires.
      - name: Select the newest validated commit of main
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          get() { curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"; }
          sha=$(get "$api/actions/workflows/validate-explorer.yml/runs?branch=main&event=push&status=success&per_page=1" | jq -er '.workflow_runs[0].head_sha')
          # A push that touches only tickets, docs or Markdown runs no validation. When nothing else
          # has landed since the validated commit, main's tip is the same code: take it, so a
          # producer record written at that tip is still an ancestor of this checkout (gate 5).
          tip=$(get "$api/compare/$sha...main" | jq -er 'if (.files | length) < 300 and all(.files[]; .filename | test("^\\.tickets/|\\.md$") or (test("^docs/") and (test("^docs/experiments/") | not))) then (.commits[-1].sha // .base_commit.sha) else empty end' || true)
          sha=${tip:-$sha}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Validated commit: $sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.validated.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
      - name: Admit the maintenance binding before runtime or storage access
        run: .venv/bin/python -I .github/scripts/run-archive-job.py maintenance --check-binding
      - name: Install and verify the pinned maintenance runtime
        env:
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: .venv/bin/python -I .github/scripts/setup-native-runtime.py --directory "$RUNNER_TEMP/docspec-runtime" --output "$RUNNER_TEMP/native-runtime-check.json" --github-env "$GITHUB_ENV" --host-limits .github/docspec-maintenance-limits.json
      - name: Run raw checks, retained receipt evidence and catalog maintenance
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .venv/bin/python -I .github/scripts/run-archive-job.py maintenance
