name: Update committee data

# Weekly pipeline. Raw caches (YouTube TinyDBs, Congress.gov meeting records)
# and compact parsed committee-source state
# live on the bot-owned `pipeline-data` branch, replaced by a single snapshot
# commit each run so history doesn't grow. main only gets the small derived
# CSVs. Every tool exits non-zero on any failure. Derived output commits require
# success; committee raw state also preserves failed-refresh receipts and the
# last usable result. Fetching is incremental, so the next run catches up.
# Publish Committee Explorer data listens for this entire workflow's completion;
# deployment happens only after that publication passes verification.
on:
  schedule:
    - cron: "0 0 * * 0" # 12:00 AM UTC Sunday
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  CHANNELS_CSV: packages/congress_shared/src/congress_shared/youtube/youtube-accounts.csv
  DATA_DIR: apps/committee_youtube/data

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Check out pipeline data
        uses: actions/checkout@v5
        with:
          ref: pipeline-data
          path: pipeline-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -e packages/house-naming -e packages/committee_meeting -e packages/congress_shared -e packages/youtube_api -e packages/congress_api

      - name: Fetch YouTube channels
        id: youtube_fetch
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: youtube-fetch --channels-csv-path "$CHANNELS_CSV" --tinydb_dir pipeline-data/youtube

      - name: Report per channel and congress
        run: |
          youtube-analyze --channels-csv-path "$CHANNELS_CSV" --tinydb_dir pipeline-data/youtube \
            --output-path "$DATA_DIR/youtube_event_id_report.csv" --nthreads 1
          # the dashboard reads its own copy
          cp "$DATA_DIR/youtube_event_id_report.csv" apps/site/public/data/youtube/youtube_event_id_report.csv

      - name: Save pipeline data snapshot
        # Preserve completed channel captures and incomplete scan markers even
        # when another channel or a later report fails.
        if: ${{ !cancelled() && (steps.youtube_fetch.outcome == 'success' || steps.youtube_fetch.outcome == 'failure') }}
        run: .github/scripts/save-pipeline-data.sh "YouTube fetch"

      - name: Commit outputs to ${{ github.ref_name }}
        run: |
          .github/scripts/commit-and-push.sh "Updated YouTube report" \
            "$DATA_DIR/youtube_event_id_report.csv" apps/site/public/data/youtube/youtube_event_id_report.csv

  congress:
    needs: youtube
    # still refresh GPO data and matches if the YouTube job failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # latest, including the youtube job's commit
      - name: Check out pipeline data
        uses: actions/checkout@v5
        with:
          ref: pipeline-data
          path: pipeline-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -e packages/house-naming -e packages/committee_meeting -e packages/congress_shared -e packages/youtube_api -e packages/congress_api

      - name: Fetch GPO hearing transcripts
        id: gpo
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: gpo-fetch --output-path "$DATA_DIR/gpo_hearings.csv" --evidence-path pipeline-data/gpo-evidence.jsonl.gz --refresh-limit 100

      - name: Fetch Congress.gov meeting records
        id: meetings
        # A GPO package failure must not stop independent meeting captures.
        if: ${{ !cancelled() && (steps.gpo.outcome == 'success' || steps.gpo.outcome == 'failure') }}
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: congress-meetings --output-path pipeline-data/congress_meetings.jsonl.gz

      - name: Match hearings to videos
        run: |
          gpo-match --tinydb_dir pipeline-data/youtube --channels-csv-path "$CHANNELS_CSV" \
            --gpo-path "$DATA_DIR/gpo_hearings.csv" --meetings pipeline-data/congress_meetings.jsonl.gz \
            --overrides "$DATA_DIR/hearing_video_overrides.csv" \
            --output-path "$DATA_DIR/gpo_hearing_videos.csv"

      - name: Save pipeline data snapshot
        if: ${{ !cancelled() && (steps.gpo.outcome == 'success' || steps.gpo.outcome == 'failure') }}
        run: .github/scripts/save-pipeline-data.sh "Congress.gov meetings and retained evidence"

      - name: Commit outputs to ${{ github.ref_name }}
        run: |
          .github/scripts/commit-and-push.sh "Updated GPO hearings and video matches" \
            "$DATA_DIR/gpo_hearings.csv" "$DATA_DIR/gpo_hearing_videos.csv" "$DATA_DIR/gpo_hearing_video_coverage.csv"

  meetings:
    needs: congress
    # Its own job: the readers depend on docs.house.gov and 22 committee sites, and a failure there must not
    # hold back the GPO and video outputs above. Runs on the last saved snapshot if the Congress job failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }} # latest, including the congress job's commit
      - name: Check out pipeline data
        uses: actions/checkout@v5
        with:
          ref: pipeline-data
          path: pipeline-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: >-
          pip install -e 'packages/house-naming[test]' -e packages/committee_meeting -e packages/congress_shared
          -e packages/youtube_api -e 'packages/congress_api[archive,test]' -e apps/committee_youtube 'PyYAML>=6,<7'

      - name: Test source parsing and refresh decisions
        run: python .github/scripts/offline-python.py -m pytest -q tests packages/committee_meeting/tests packages/house-naming/tests .github/tests

      - name: Read House repository records
        id: house_records
        run: |
          house-meeting-records --meetings pipeline-data/congress_meetings.jsonl.gz \
            --gpo-path "$DATA_DIR/gpo_hearings.csv" --state-dir pipeline-data/meeting-inventory \
            --output-dir "$DATA_DIR" --refresh-limit 400

      - name: Read Senate committee pages
        id: senate_records
        if: ${{ !cancelled() && (steps.house_records.outcome == 'success' || steps.house_records.outcome == 'failure') }}
        run: |
          senate-meeting-records --meetings pipeline-data/congress_meetings.jsonl.gz \
            --state-dir pipeline-data/meeting-inventory --output-dir "$DATA_DIR" --refresh-limit 450

      - name: Build meeting inventory
        if: ${{ !cancelled() && (steps.senate_records.outcome == 'success' || steps.senate_records.outcome == 'failure') }}
        run: |
          meeting-inventory --meetings pipeline-data/congress_meetings.jsonl.gz \
            --gpo-path "$DATA_DIR/gpo_hearings.csv" --videos-path "$DATA_DIR/gpo_hearing_videos.csv" \
            --tinydb_dir pipeline-data/youtube --channels-csv-path "$CHANNELS_CSV" \
            --recordings "$DATA_DIR/meeting_recordings_found.csv" \
            --state-dir pipeline-data/meeting-inventory --output-dir "$DATA_DIR"

      - name: Save pipeline data snapshot
        # The readers save the last usable records and each failed check before
        # raising. Persist that evidence even when a later reader/inventory fails;
        # do not save when setup/tests stopped the job before any reader ran.
        if: ${{ !cancelled() && (steps.house_records.outcome == 'success' || steps.house_records.outcome == 'failure') }}
        run: .github/scripts/save-pipeline-data.sh "Parsed committee records"

      - name: Commit outputs to ${{ github.ref_name }}
        run: |
          .github/scripts/commit-and-push.sh "Updated meeting inventory" \
            "$DATA_DIR/hearing_text_sources.csv" "$DATA_DIR/meetings_without_records.csv" \
            "$DATA_DIR/house_documents_found.csv" "$DATA_DIR/house_witnesses_found.csv" "$DATA_DIR/house_amendments_found.csv" \
            "$DATA_DIR/senate_hearing_pages_found.csv" "$DATA_DIR/senate_witnesses_found.csv" "$DATA_DIR/senate_documents_found.csv" \
            "$DATA_DIR/meeting_completeness.csv" "$DATA_DIR/meeting_witnesses.csv"

  committees:
    needs: meetings
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v5
        with:
          ref: pipeline-data
          path: pipeline-data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -e packages/house-naming -e packages/committee_meeting -e packages/congress_shared -e packages/youtube_api -e packages/congress_api
      - name: Refresh official committee metadata
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
        run: |
          congress-committees --meetings-path pipeline-data/congress_meetings.jsonl.gz \
            --gpo-path "$DATA_DIR/gpo_hearings.csv" --output-path pipeline-data/congress_committees.jsonl.gz
      - name: Save committee metadata
        run: .github/scripts/save-pipeline-data.sh "Official committee metadata"
