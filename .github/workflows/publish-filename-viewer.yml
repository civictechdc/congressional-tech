name: Publish filename viewer data to R2

on:
  workflow_run:
    workflows: ["Capture raw sources and update document tables"]
    types: [completed]
    branches: [main]
  schedule:
    # Also discovers catalogs selected by verified local recovery runs.
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      resume_descriptor:
        description: Original-attempt JSON from the describe-attempt command (explicit resume only)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'packages/congress_api/src/congress_api/**'
      - 'packages/congress_shared/src/congress_shared/**'
      - 'packages/viewer_publication/**'
      - 'apps/site/document-review-identities.json'
      - 'apps/site/document-review-publication.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'packages/viewer_publication/src/viewer_publication/filename*.py'
      - 'scripts/publication_preflight.py'
      - 'scripts/tests/test_publication_preflight.py'
      - '.python-version'
      - '.github/actions/setup-python-project/action.yml'
      - 'scripts/viewer_release_identity.py'
      - 'scripts/publication/**'
      - 'packages/viewer_publication/tests/test_viewer_publication_attempt.py'
      - 'packages/viewer_publication/tests/test_recovery_publication_continuation.py'
      - 'packages/viewer_publication/tests/test_guarded_recovery_publication_client.py'
      - 'packages/viewer_publication/tests/test_recovery_viewer_transfers.py'
      - 'scripts/publication/publish-viewer-r2.py'
      - 'scripts/publication/publish-filename-viewer.py'
      - 'scripts/publication/filename-test-fixture.py'
      - 'packages/viewer_publication/src/viewer_publication/filename_observations.py'
      - 'packages/viewer_publication/src/viewer_publication/filename_details.py'
      - 'packages/viewer_publication/src/viewer_publication/filename_navigation.py'
      - 'packages/viewer_publication/src/viewer_publication/filename_recoveries.py'
      - 'packages/viewer_publication/tests/test_filename_recoveries.py'
      - 'packages/viewer_publication/tests/test_filename_observations.py'
      - 'packages/viewer_publication/tests/test_filename_details.py'
      - '.github/tests/test_filename_publication.py'
      - '.github/tests/test_viewer_r2.py'
      - '.github/workflows/publish-filename-viewer.yml'
      - '.github/scripts/check-native-runtime.py'
      - '.github/scripts/setup-native-runtime.py'
      - '.github/docspec-remote.json'
      - '.github/tests/test_native_runtime_setup.py'
      - '.github/tests/test_native_runtime_preflight.py'

permissions:
  contents: read
  actions: read

# This publisher writes only viewer-publications/, never the archive selector.
concurrency:
  group: filename-viewer-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Begin publication job cost observation
        run: |
          python3 - <<'PYTHON'
          import json, os, time
          from pathlib import Path
          received = sum(int(path.read_text()) for path in Path('/sys/class/net').glob('*/statistics/rx_bytes'))
          Path(os.environ['RUNNER_TEMP'], 'publication-job-start.json').write_text(json.dumps({'time':time.time(),'received_bytes':received}))
          PYTHON
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Validate original-attempt descriptor before workspace setup
        id: resume
        env:
          RESUME_DESCRIPTOR: ${{ inputs.resume_descriptor }}
        run: python3 scripts/publication/prepare_workflow_resume.py
      - name: Check out the original preparation revision
        if: steps.resume.outputs.resume == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resume.outputs.revision }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
      - name: Read-only publication preflight before workspace setup
        id: preflight
        if: steps.resume.outputs.resume == 'false'
        env:
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/publication_preflight.py --report viewer-preflight.json
      - uses: ./.github/actions/setup-python-project
        if: github.event_name == 'push' || steps.resume.outputs.resume == 'true' || steps.preflight.outputs.status == 'preparation_required'
      - name: Verify publication fidelity and recovery mapping
        if: github.event_name == 'push' || steps.resume.outputs.resume == 'true' || steps.preflight.outputs.status == 'preparation_required'
        run: |
          tests=(
            .github/tests/test_native_runtime_setup.py
            .github/tests/test_native_runtime_preflight.py
            .github/tests/test_filename_publication.py
            .github/tests/test_viewer_r2.py
            packages/viewer_publication/tests/test_filename_recoveries.py
            packages/viewer_publication/tests/test_filename_observations.py
            packages/viewer_publication/tests/test_filename_details.py
            packages/viewer_publication/tests/test_viewer_publication_attempt.py
            packages/viewer_publication/tests/test_guarded_recovery_publication_client.py
            packages/viewer_publication/tests/test_recovery_publication_continuation.py
            scripts/tests/test_publication_preflight.py
            scripts/publication/tests/test_publication_cli.py
            packages/viewer_publication/tests/test_publication_state_bounds.py
            packages/viewer_publication/tests/test_publication_control_reads.py
          )
          # Original attempts may predate the test relocation. Both routes stay
          # inside the exact selected checkout; no other checkout supplies tests.
          for index in "${!tests[@]}"; do
            if [ ! -f "${tests[$index]}" ] && [ -f "tests/${tests[$index]##*/}" ]; then
              tests[$index]="tests/${tests[$index]##*/}"
            fi
          done
          PYTHONPATH=scripts/publication:scripts python -m pytest -q "${tests[@]}"
      - name: Require approved native runtime for preparation
        if: steps.resume.outputs.resume == 'false' && steps.preflight.outputs.status == 'preparation_required'
        env:
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          DOCSPEC_RUNTIME_ARTIFACT: ${{ vars.DOCSPEC_RUNTIME_ARTIFACT }}
          DOCSPEC_ENGINE_CREDENTIALS: ${{ secrets.DOCSPEC_ENGINE_CREDENTIALS }}
        run: >-
          python .github/scripts/setup-native-runtime.py
          --directory "$RUNNER_TEMP/docspec-runtime" --output native-runtime-check.json
          --github-env "$GITHUB_ENV"
      - name: Prepare a changed catalog or recovery index
        id: prepare
        if: steps.resume.outputs.resume == 'false' && steps.preflight.outputs.status == 'preparation_required'
        env:
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/publication/publish-viewer-r2.py prepare --native-config "$DOCSPEC_RUNTIME_CONFIG" --directory viewer-preparation --report viewer-publication.json
      - name: Accept preparation before any publication write
        id: accepted
        if: steps.prepare.outputs.status == 'prepared'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: viewer-preparation/
          compression-level: 0
          if-no-files-found: error
          overwrite: false
      - name: Restore explicitly selected preparation
        if: steps.resume.outputs.resume == 'true'
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ steps.resume.outputs.artifact_id }}
          run-id: ${{ steps.resume.outputs.run_id }}
          github-token: ${{ github.token }}
          path: viewer-preparation
          merge-multiple: true
      - name: Verify complete preparation inventory
        if: steps.prepare.outputs.status == 'prepared' || steps.resume.outputs.resume == 'true'
        run: python scripts/publication/publish-viewer-r2.py verify-prepared --directory viewer-preparation
      - name: Publish accepted preparation
        if: steps.prepare.outputs.status == 'prepared' || steps.resume.outputs.resume == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: '174055408ff1560e60601c4d12c561c4'
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARTIFACT_ID: ${{ steps.accepted.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.accepted.outputs.artifact-digest }}
          PREPARATION_RUN: ${{ github.run_id }}
          EXPLICIT_RESUME: ${{ steps.resume.outputs.resume }}
        run: |
          if [ "$EXPLICIT_RESUME" = true ]; then
            python scripts/publication/publish-viewer-r2.py publish --directory viewer-preparation \
              --resume --resume-descriptor "$RUNNER_TEMP/viewer-resume.json" --report viewer-publication.json
          else
            python scripts/publication/publish-viewer-r2.py publish --directory viewer-preparation \
              --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
              --run-id "$PREPARATION_RUN" --report viewer-publication.json
          fi
      - name: Record observed publication job cost
        if: always()
        env:
          PREFLIGHT_STATUS: ${{ steps.preflight.outputs.status }}
        run: |
          python - <<'PYTHON'
          import json, os, time
          from pathlib import Path
          start = json.loads(Path(os.environ['RUNNER_TEMP'], 'publication-job-start.json').read_text())
          received = sum(int(path.read_text()) for path in Path('/sys/class/net').glob('*/statistics/rx_bytes'))
          value = {'version':1,'observed_job_step_seconds':time.time()-start['time'],
                   'observed_host_received_bytes':received-start['received_bytes'],
                   'preflight_status':os.environ['PREFLIGHT_STATUS'],
                   'full_workspace_setup_skipped':os.environ['PREFLIGHT_STATUS']=='unchanged' and os.environ['GITHUB_EVENT_NAME']!='push',
                   'scope':'first job step through this receipt; excludes runner allocation, post-job cleanup and artifact upload; host bytes include managed background traffic'}
          if Path('viewer-preflight.json').exists(): value['preflight']=json.loads(Path('viewer-preflight.json').read_text())
          Path('viewer-job-cost.json').write_text(json.dumps(value,indent=2)+'\n')
          PYTHON
      - name: Record publication outcome
        if: always()
        run: |
          if [ -f viewer-preflight.json ]; then cat viewer-preflight.json >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f viewer-publication.json ]; then
            cat viewer-publication.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewer-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            viewer-publication.json
            viewer-preflight.json
            viewer-job-cost.json
            native-runtime-check.json
            viewer-preparation/continuation.json
            viewer-preparation/journal/
            viewer-preparation/journal-intents/
            viewer-preparation/publication-result.json
            viewer-preparation/preparation.json
            viewer-preparation/prepared-result.json
            viewer-preparation/publication/preparation-memory-failure.json
            viewer-preparation/publication/**/preparation-memory-failure.json
          if-no-files-found: ignore
