[project]
name = "congress-youtube"
version = "0.1.0"
description = "A tool to fetch and process Congressional committee meeting metadata to link to YouTube recordings."
authors = [
  { name="Alex Gurvich", email="alex.b.gurvich@gmail.com" }
]
requires-python = ">=3.12"
readme = "README.md"
# This app is a thin aggregator: it pulls in the real implementation packages.
# The console scripts (youtube-fetch/-analyze, congress-fetch/-analyze) are
# defined by those packages, so installing this app puts all four on PATH.
dependencies = [
  "congress-api",
  "youtube-api",
  "tinydb",
]

[project.urls]
Homepage = "https://github.com/civictechdc/congressional-tech"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Metadata-only distribution: no importable modules of its own, just the
# dependency graph + (via its deps) the console scripts.
[tool.setuptools]
packages = []
py-modules = []

# uv-native path sources (ignored by pip). Lets `uv pip install -e .`
# resolve the sibling packages from the local tree instead of an index.
[tool.uv.sources]
congress-api = { path = "../../packages/congress_api", editable = true }
youtube-api = { path = "../../packages/youtube_api", editable = true }
