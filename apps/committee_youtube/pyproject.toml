[project]
name = "congress-youtube"
version = "0.1.0"
description = "A tool to fetch and process Congressional committee meeting metadata to link to YouTube recordings."
authors = [
  { name="Alex Gurvich", email="alex.b.gurvich@gmail.com" }
]
requires-python = ">=3.12"
readme = "README.md"
# Source commands stay in their packages; this app owns Explorer publication.
dependencies = [
  "committee-meeting",
  "congress-api",
  "youtube-api",
  "tinydb",
]

[project.scripts]
committee-explorer-export = "committee_explorer.export:main"

[project.urls]
Homepage = "https://github.com/civictechdc/congressional-tech"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# uv-native path sources (ignored by pip). Lets `uv pip install -e .`
# resolve the sibling packages from the local tree instead of an index.
[tool.uv.sources]
committee-meeting = { path = "../../packages/committee_meeting", editable = true }
congress-api = { path = "../../packages/congress_api", editable = true }
youtube-api = { path = "../../packages/youtube_api", editable = true }
