[project]
name = "congressional-explorer-mcp"
dynamic = ["version"]
description = "Local Congress research over immutable archive releases"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Civic Tech DC"}]
keywords = ["mcp", "congress", "hearings", "legislation", "duckdb"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: MacOS", "Operating System :: POSIX :: Linux"]
requires-python = ">=3.12"
dependencies = ["duckdb==2.0.0", "fastmcp==4.1.4"]

[project.urls]
Homepage = "https://civictechdc.github.io/congressional-tech/mcp/"
Repository = "https://github.com/civictechdc/congressional-tech"
Issues = "https://github.com/civictechdc/congressional-tech/issues"

[project.scripts]
congress-explorer-mcp = "congressional_explorer_mcp.cli:main"
congressional-explorer-mcp = "congressional_explorer_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pyarrow>=23,<24"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "congressional_explorer_mcp.__version__"}

# Independent runtime: producer packages still require DuckDB 1.x.
[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
